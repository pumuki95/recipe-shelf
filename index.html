<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Recipe Shelf</title>
<script>try{var t=localStorage.getItem("rs-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a kitchen shelf of video-sourced recipe cards; each opens a full cook sheet; a shared grocery list collects from any card. */
:root{
  --bg:#F3F5F0; --paper:#FFFFFF; --ink:#18201A; --muted:#5D685F; --line:#DCE2D9;
  --basil:#2E6A41; --basil-soft:#E1EEE3; --mustard:#E2A62B; --mustard-soft:#FBF0D6; --chili:#B8432E;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111612; --paper:#1A211C; --ink:#E9EEE8; --muted:#9AA79C; --line:#2C362E;
  --basil:#7CC48F; --basil-soft:#1F3326; --mustard:#F0BB4D; --mustard-soft:#3A2F14; --chili:#EE8670; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111612; --paper:#1A211C; --ink:#E9EEE8; --muted:#9AA79C; --line:#2C362E;
  --basil:#7CC48F; --basil-soft:#1F3326; --mustard:#F0BB4D; --mustard-soft:#3A2F14; --chili:#EE8670; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto}
a{color:var(--basil)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--basil);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar: title · search · sections, all on one line */
header.top{display:grid;grid-template-columns:auto minmax(200px,1fr) auto;grid-template-areas:"brand search nav";align-items:center;gap:10px 18px;padding:16px 0 12px}
.brand{grid-area:brand;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);line-height:1.1}
.brand h1{font-size:clamp(22px,2.6vw,27px);font-weight:800;white-space:nowrap}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
header.top .search{grid-area:search;max-width:none}
nav.tabs{grid-area:nav;display:flex;gap:6px;align-items:center}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);display:flex;gap:6px;align-items:center;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-family:var(--mono);font-size:12px;background:var(--mustard);color:#1d1606;border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
.themebtn{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:grid;place-items:center;flex:none;padding:0}
.themebtn svg{width:18px;height:18px}
@media (max-width:900px){
  header.top{grid-template-columns:auto 1fr;grid-template-areas:"brand nav" "search search"}
  nav.tabs{justify-content:flex-end;flex-wrap:wrap}
}
@media (max-width:600px){
  header.top{grid-template-columns:1fr;grid-template-areas:"brand" "nav" "search"}
  nav.tabs{justify-content:flex-start}
  nav.tabs a{padding:6px 10px;font-size:13px}
  nav.tabs .long{display:none}
  header.top{position:relative}
  header.top .themebtn{position:absolute;right:0;top:14px}
}

/* filters: two compact rows, every option visible */
.filters{display:flex;flex-direction:column;gap:6px;padding:0 0 16px}
.search{width:100%;max-width:420px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.fgroup{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 8px;font-size:12px;font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--basil);border-color:var(--basil);color:var(--bg)}
.group-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:2px;align-self:center}
.ftools{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ftools select{font:inherit;font-size:12.5px;max-width:170px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 8px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px -12px rgba(0,0,0,.35)}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.src{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:11px;background:rgba(10,14,11,.78);color:#fff;padding:3px 8px;border-radius:6px}
.part{position:absolute;right:10px;top:10px;font-family:var(--mono);font-size:11px;background:var(--mustard);color:#1d1606;padding:3px 8px;border-radius:6px;font-weight:500}
.cbody{padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cbody h3{font-size:18px;font-weight:700;line-height:1.2}
.meta{display:flex;gap:12px;color:var(--muted);font-size:13px}
.macro-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.mpill{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:6px;background:var(--mustard-soft);color:var(--ink)}
.mpill b{font-weight:500;color:var(--chili)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--basil-soft);color:var(--basil);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* detail */
.back{display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-weight:600;margin:4px 0 14px}
.detail{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
.hero img{width:100%;border-radius:var(--r);display:block;aspect-ratio:16/9;object-fit:cover}
.hero .srcline{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.dhead h2{font-size:clamp(28px,4.4vw,42px);font-weight:800;line-height:1.05}
.dhead .from{font-size:13px;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:18px 0 14px}
.stat{background:var(--paper);padding:10px 12px}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--muted)}
.nutri{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.nutri h3{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.nutri h3 span{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line);margin:8px 0 10px}
.bar i{display:block}
.yieldrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:0 0 10px}
.ynote{font-size:12px;color:var(--muted);margin:-4px 0 10px;line-height:1.4}
.ynote .linkbtn{font-size:12px;padding:0;margin-left:4px}
.nrow{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-size:14px}
.nrow .num{text-align:right}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle}
.est{font-size:11px;color:var(--muted);font-family:var(--mono)}
.section{margin-top:28px}
.section h3{font-size:22px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.scaler{display:flex;align-items:center;gap:8px;font-family:var(--body);font-size:13px;font-weight:500}
.scaler button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:16px;line-height:1}
.ing-group{margin-bottom:14px}
.ing-group h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:grid;grid-template-columns:22px 100px minmax(0,1fr);gap:10px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line)}
.ing li.off .q,.ing li.off .n{opacity:.45}
.ing input.pick{margin:3px 0 0;width:16px;height:16px;accent-color:var(--basil)}
.ing label{cursor:pointer}
.staple{color:var(--muted);font-size:11px;font-family:var(--mono)}
.pickbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-2px 0 10px}
.linkbtn{background:none;border:none;padding:0;color:var(--basil);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{text-decoration:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--chili)}
.glbtns{display:flex;gap:8px;flex-wrap:wrap}
.rchip{display:inline-flex;align-items:center;gap:2px;background:var(--basil-soft);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;font-weight:600}
.rchip a{color:var(--basil);text-decoration:none}
.x{background:none;border:none;color:var(--muted);font-size:18px;line-height:1;width:28px;height:28px;border-radius:8px;flex:none}
.x:hover{background:var(--line);color:var(--chili)}
.gi{align-items:center}
.gi label{flex:1;min-width:0;cursor:pointer}
.ing .q{font-family:var(--mono);font-size:14px;color:var(--basil);font-variant-numeric:tabular-nums}
.ing .n small{color:var(--muted)}
.flag{font-size:10px;font-family:var(--mono);color:var(--chili);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:4px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--basil);color:var(--bg)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:20px;width:34px;height:34px;border-radius:50%;background:var(--basil-soft);color:var(--basil);display:grid;place-items:center}
.steps li.done{opacity:.45}
.steps li.done::before{content:"✓"}
.steps b{display:block;font-family:var(--display);font-size:16px}
.note{background:var(--mustard-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* grocery */
.gl-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.gl-head h2{font-size:clamp(26px,4vw,36px);font-weight:800}
.gl-recipes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.gl-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.aisle{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.aisle h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--basil)}
.gi{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.gi:last-child{border-bottom:none}
.gi input{margin-top:3px;accent-color:var(--basil);width:16px;height:16px}
.gi.got label{text-decoration:line-through;color:var(--muted)}
.gi small{display:block;color:var(--muted);font-size:12px}

/* simple text pages (unlock editing) */
.howto{max-width:680px}
.howto h2{font-size:clamp(26px,4vw,36px);font-weight:800;margin-bottom:10px}
.howto ol{padding-left:20px}
.howto li{margin-bottom:8px}

/* fractions: built from full-size digits so ⅓ reads as clearly as 3 */
.frac{display:inline-flex;align-items:baseline;font-family:var(--body);font-weight:700;letter-spacing:0;white-space:nowrap}
.frac sup,.frac sub{font-size:.82em;line-height:1;position:relative;vertical-align:baseline}
.frac sup{top:-.38em}
.frac sub{top:.12em}
.frac .sl{margin:0 .04em;font-weight:500}
.wh + .frac{margin-left:.12em}

/* nutrition detail rows */
.nrow .sub{padding-left:16px;color:var(--muted)}
.nrow .sub2{padding-left:32px;color:var(--muted)}
.nrow .sep{grid-column:1 / -1;border-top:1px dashed var(--line);margin:4px 0}
.nfoot{font-size:12px;color:var(--muted);margin-top:8px}

/* plan & compare on the recipe page */
.actrow{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.actrow .fgroup{gap:4px}

/* meal plan */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.day{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.day h4{margin:0;font-family:var(--display);font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.day h4 small{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.pitem{display:grid;grid-template-columns:64px minmax(0,1fr) 28px;gap:10px;align-items:center}
.pitem img{width:64px;height:36px;object-fit:cover;border-radius:6px;display:block}
.pitem .pt{font-weight:600;font-size:14px;line-height:1.25;color:var(--ink);text-decoration:none;display:block}
.pmeta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}
.pmeta button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-size:13px;line-height:1;padding:0}
.picker{display:flex;flex-direction:column;gap:6px}
.pres button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:none;border-bottom:1px dashed var(--line);padding:6px 0;font-size:13px}
.pres img{width:44px;height:25px;object-fit:cover;border-radius:4px}
.banner{background:var(--mustard-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* compare */
.famgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fam{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.fam:hover{border-color:var(--basil)}
.fam b{font-family:var(--display);font-size:16px}
.fam .thumbs{display:flex;gap:4px}
.fam .thumbs img{width:33%;aspect-ratio:16/9;object-fit:cover;border-radius:6px}
.wins{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:12px 0 18px}
.win{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink)}
.win.sel{border-color:var(--basil);box-shadow:0 0 0 1px var(--basil) inset}
.win img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none}
.win .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--basil);font-weight:700}
.win .t{font-weight:600;font-size:13.5px;line-height:1.25}
.win .v{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
table.cmp{border-collapse:collapse;width:100%;font-size:13.5px;min-width:860px}
table.cmp th,table.cmp td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.cmp th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--paper)}
table.cmp th button{all:unset;cursor:pointer}
table.cmp th.sel,table.cmp td.sel{background:var(--basil-soft)}
table.cmp td{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.cmp td.rc{text-align:left;font-family:var(--body);white-space:normal;min-width:240px}
table.cmp td.rc a{display:flex;gap:10px;align-items:center;color:var(--ink);text-decoration:none;font-weight:600;line-height:1.25}
table.cmp td.rc img{width:64px;height:36px;object-fit:cover;border-radius:6px;flex:none}
table.cmp td.rc small{display:block;font-weight:400;color:var(--muted);font-size:12px}
table.cmp td.rank{font-family:var(--display);font-weight:800;color:var(--basil);text-align:center;width:32px}
table.cmp td.best{color:var(--basil);font-weight:700}
table.cmp td.best::after{content:" ★";font-size:11px}
table.cmp tr:last-child td{border-bottom:none}
.basis{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.basis button{border:none;background:var(--paper);padding:5px 12px;font-size:12.5px;font-weight:600}
.basis button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

@media (max-width:780px){
  .detail{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* editor */
.edit-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.edit-link{color:var(--muted);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.edited{font-family:var(--mono);font-size:11px;background:var(--basil-soft);color:var(--basil);border-radius:6px;padding:2px 7px}
.editbar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--mustard-soft);border-radius:12px;padding:12px 14px;margin:6px 0 18px}
.eform{display:flex;flex-direction:column;gap:22px;max-width:860px}
.eform section{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.eform h3{font-size:17px;margin-bottom:10px}
.flabel{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.fin{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;min-width:0}
textarea.fin{resize:vertical;line-height:1.45}
.erow3,.erow4{display:grid;gap:10px}
.erow3{grid-template-columns:repeat(3,minmax(0,1fr))}
.erow4{grid-template-columns:repeat(4,minmax(0,1fr))}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:10px}
.chk input{accent-color:var(--basil);width:16px;height:16px}
.chk.sm{font-size:12px;margin:0;white-space:nowrap;color:var(--muted)}
.egroup{border-top:1px dashed var(--line);padding:12px 0}
.egroup:first-of-type{border-top:none;padding-top:0}
.egh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.egh .fin{font-weight:700}
.eitems{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.eitem{display:grid;grid-template-columns:70px 70px minmax(0,2fr) minmax(0,1.3fr) 112px auto 28px;gap:6px;align-items:center}
.estep{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.snum{font-family:var(--display);font-weight:800;font-size:18px;color:var(--basil);padding-top:6px}
.sfields{display:flex;flex-direction:column;gap:6px}
.sbtns{display:flex;flex-direction:column;gap:4px}
.mini{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;margin-top:6px}
.mini[disabled]{opacity:.35;cursor:not-allowed}
.savebar{position:sticky;bottom:0;margin-top:22px;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.sb-in{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
.sb-in .btn.ghost{color:var(--bg);border-color:rgba(255,255,255,.35)}
.btn.dangerfill{background:var(--chili);color:#fff}
.errmsg{color:var(--chili);font-weight:600}
.sb-in .errmsg{color:#ffb4a3}
.danger-zone{background:transparent !important}
@media (max-width:780px){
  .erow3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .erow4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .eitem{grid-template-columns:64px 64px minmax(0,1fr) 28px;}
  .eitem .nt{grid-column:1 / 4}
  .eitem .a{grid-column:1 / 3}
  .eitem .chk{grid-column:3 / 5}
  .eitem .x{grid-row:1;grid-column:4}
}
@media (prefers-reduced-motion:reduce){.card,.toast{transition:none}}
/* phones: each filter group is one swipeable line instead of wrapping */
@media (max-width:600px){
  .filters .fgroup{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  .filters .fgroup .chip{flex:none}
  .filters .ftools{margin-left:0}
}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <a class="brand" href="#"><h1>The Recipe Shelf</h1><span id="tally"></span></a>
    <input id="q" class="search" type="search" placeholder="Search recipes or ingredients" aria-label="Search recipes">
    <nav class="tabs" aria-label="Sections">
      <a href="#" id="nav-shelf">Recipes</a>
      <a href="#plan" id="nav-plan">Plan <span class="count num" id="pcount" hidden>0</span></a>
      <a href="#compare" id="nav-compare">Compare</a>
      <a href="#grocery" id="nav-grocery"><span>Grocery<span class="long"> list</span></span><span class="count num" id="gcount">0</span></a>
      <button class="themebtn" id="theme" type="button"></button>
    </nav>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Recipes live in recipes.json (built from data/*.json); photos in img/. */
let SRC = {}, RECIPES = [];
/* ---------- helpers ---------- */
const pl = (u,n) => n===1 ? u : ({half:"halves",serving:"servings"}[u] || (/(ch|sh|s|x)$/.test(u) ? u+"es" : u+"s"));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
try{ localStorage.removeItem("rs-yield"); }catch(e){}   /* batch yield is no longer saved */
let state = {
  q:"", tags:new Set(), sort:"new",
  grocery: store.get("rs-grocery", {}),   // id -> servings
  got: store.get("rs-got", {}),
  yield: {},        // id -> {sv, n}: servings actually got from a batch of sv (not saved; resets when the recipe is reopened)
  plan: store.get("rs-plan", null) || {days:[[],[],[],[],[],[],[]]},   // days[0..6] = [{id, sv}]
  cmp: store.get("rs-cmp", []),           // recipe ids picked for "My comparison"
  goal: "ppc", basis: "serving",
  scale: {}, done: {}, pick: {}
};
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAYS_LONG = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const mins = r => { const t = r.time; if(typeof t==="number") return t; const m = String(t).split("+")[0]; const h = /(\d+(?:\.\d+)?)\s*h/.exec(m), mi = /(\d+)\s*min/.exec(m); return (h?+h[1]*60:0)+(mi?+mi[1]:0) || 999; };
const tlabel = r => typeof r.time==="number" ? r.time+" min" : String(r.time);
const byId = id => RECIPES.find(x=>x.id===id);
const thumb = r => r.img.replace('img/','img/t/');
const slug = s => s.toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
let FAMILIES = {};
/* ---------- nutrition helpers ---------- */
const LOW_SUGAR_MAX = 5, HIGH_FIBER_MIN = 5; /* grams per serving */
const NUTS = ["cal","protein","carbs","fat","fiber","sugar","addedSugar","sugarAlcohol"];
const isEst = (r,k) => !r.stated.includes(k);
const net = r => Math.max(0, Math.round((r.macros.carbs - (r.macros.fiber||0))*10)/10);
const ppc = r => r.macros.cal ? r.macros.protein / r.macros.cal * 100 : 0;
const g1 = v => (Math.round(v*10)/10).toString();
/* ---------- theme ---------- */
const ICO = {
  auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
  light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'};
const THEMES = {auto:[ICO.auto,"Theme: follows your device (tap for light)"], light:[ICO.light,"Theme: light (tap for dark)"], dark:[ICO.dark,"Theme: dark (tap to follow your device)"]};
function applyTheme(t){
  if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  const b = $("#theme"); b.innerHTML = THEMES[t][0]; b.title = THEMES[t][1]; b.setAttribute("aria-label", THEMES[t][1]);
}
function cycleTheme(){
  const cur = (()=>{ try{ return localStorage.getItem("rs-theme")||"auto"; }catch(e){ return "auto"; } })();
  const next = {auto:"light", light:"dark", dark:"auto"}[cur] || "auto";
  try{ next==="auto" ? localStorage.removeItem("rs-theme") : localStorage.setItem("rs-theme", next); }catch(e){}
  applyTheme(next); toast(next==="auto" ? "Following your device's light/dark setting" : next==="light" ? "Light mode" : "Dark mode");
}
const fmtTime = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const FR = [[.125,"⅛"],[.25,"¼"],[.333,"⅓"],[.5,"½"],[.667,"⅔"],[.75,"¾"]];
function fmtQ(n){
  if(n==null) return "";
  if(n >= 20) return String(Math.round(n));
  const w = Math.floor(n), f = n - w;
  if(f < .06) return String(w);
  if(f > .94) return String(w+1);
  let best = FR.reduce((a,b)=> Math.abs(b[0]-f) < Math.abs(a[0]-f) ? b : a);
  if(Math.abs(best[0]-f) < .06) return (w ? w : "") + best[1];
  return (Math.round(n*10)/10).toString();
}
/* Same as fmtQ, but fractions are built from full-size digits (1⁄3) instead of the tiny ⅓ glyph. */
const FRH = {"⅛":[1,8],"¼":[1,4],"⅓":[1,3],"½":[1,2],"⅔":[2,3],"¾":[3,4]};
function fmtQH(n){
  const t = fmtQ(n), m = t.match(/^(\d*)([⅛¼⅓½⅔¾])$/);
  if(!m) return t;
  const [nu, de] = FRH[m[2]];
  return (m[1] ? `<span class="wh">${m[1]}</span>` : "") + `<span class="frac" aria-label="${m[1]?m[1]+" and ":""}${nu}/${de}"><sup>${nu}</sup><span class="sl">⁄</span><sub>${de}</sub></span>`;
}
const fracText = h => String(h).replace(/(\d?)([⅛¼⅓½⅔¾])/g, (_, w, g) => { const [nu,de] = FRH[g]; return (w?`<span class="wh">${w}</span>`:"")+`<span class="frac"><sup>${nu}</sup><span class="sl">⁄</span><sub>${de}</sub></span>`; });
function savePlan(){ store.set("rs-plan", state.plan); pcount(); }
function pcount(){ const n = state.plan.days.reduce((a,d)=>a+d.length,0), el=$("#pcount"); el.textContent=n; el.hidden=!n; }
function saveCmp(){ store.set("rs-cmp", state.cmp); }
function copyText(txt, msg="Copied"){
  try{ navigator.clipboard.writeText(txt).then(()=>toast(msg), ()=>fallbackCopy(txt)); }catch(e){ fallbackCopy(txt); }
}
/* Share sheet (iPhone/Mac/Android: WhatsApp, Notes, Messages…); falls back to copying. */
async function shareText(title, txt){
  if(navigator.share){
    try{ await navigator.share({title, text:txt}); return; }catch(e){ if(e && e.name==="AbortError") return; }
  }
  copyText(txt, "Copied — paste it into WhatsApp or Notes");
}
const waLink = txt => "https://wa.me/?text=" + encodeURIComponent(txt);
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast._); toast._=setTimeout(()=>t.classList.remove("on"),1800); }
function gcount(){ $("#gcount").textContent = Object.keys(state.grocery).length; }
function saveG(){ store.set("rs-grocery", state.grocery); store.set("rs-got", state.got); gcount(); }

/* ---------- shelf ---------- */
/* Two rows: [Meal | Protein] and [Carb | Diet | count · sort]. */
const FILTER_ROWS = [
  [["Meal", ["Breakfast","Main meal","Side dish","Snack","Dessert"]],
   ["Protein", ["Ground beef","Chicken","Pork","Fish","Eggs","Plant-based"]]],
  [["Carb", ["Rice","Pasta","Noodles","Bread","Pizza","Tortillas","Potatoes"]],
   ["Diet", ["High protein","Low carb","Low sugar","High fiber","Gluten-free","No-bake","Meal prep"]]]
];
const FILTERS = FILTER_ROWS.flat();
const LOW_CARB_MAX = 20; /* grams of carbs per serving */
const ALWAYS = ["Low carb","Low sugar","High fiber","Breakfast","Main meal","Side dish","Snack","Dessert"];
const SORTS = {
  new:["Newest", null],
  ppc:["Protein per cal", r=>-ppc(r)],
  cal:["Fewest calories", r=>r.macros.cal],
  sugar:["Least sugar", r=>r.macros.sugar],
  fiber:["Most fiber", r=>-r.macros.fiber],
  quick:["Quickest", r=>mins(r)]
};
function shelfList(){
  const q = state.q.trim().toLowerCase();
  let list = RECIPES.filter(r=>{
    const hay = (r.title+" "+r.tags.join(" ")+" "+(r.families||[]).join(" ")+" "+r.groups.flatMap(g=>g.items.map(i=>i.i)).join(" ")).toLowerCase();
    if(q && !hay.includes(q)) return false;
    for(const t of state.tags) if(!r.tags.includes(t)) return false;
    return true;
  });
  const f = SORTS[state.sort][1];
  if(f) list = list.slice().sort((a,b)=>f(a)-f(b));
  return list;
}
function shelf(){
  const allTags = new Set(RECIPES.flatMap(r=>r.tags));
  const list = shelfList();
  const group = ([label, opts]) => {
    const present = opts.filter(o=>allTags.has(o) || ALWAYS.includes(o));
    return present.length ? `<div class="fgroup"><span class="group-label">${label}</span>${present.map(o=>`<button class="chip" data-tag="${esc(o)}" aria-pressed="${state.tags.has(o)}">${esc(o)}</button>`).join("")}</div>` : "";
  };
  $("#app").innerHTML = `
    <div class="filters">
      <div class="frow">${FILTER_ROWS[0].map(group).join("")}
        <div class="ftools">${state.tags.size||state.q?`<span class="num">${list.length} match${list.length===1?"":"es"}</span><button class="linkbtn" id="clr">Clear</button>`:""}
          <select id="sort" aria-label="Sort recipes">${Object.entries(SORTS).map(([k,[l]])=>`<option value="${k}" ${k===state.sort?"selected":""}>Sort: ${l}</option>`).join("")}</select></div></div>
      <div class="frow">${FILTER_ROWS[1].map(group).join("")}</div>
    </div>
    <div class="grid">${list.length ? list.map(card).join("") : `<div class="empty">No recipes match those filters.${state.tags.has("Low carb")?` Low carb means ${LOW_CARB_MAX} g of carbs or less per serving.`:""}${state.tags.has("Low sugar")?` Low sugar means ${LOW_SUGAR_MAX} g of sugar or less per serving.`:""}</div>`}</div>`;
  document.querySelectorAll(".chip[data-tag]").forEach(b=>b.onclick=()=>{ const t=b.dataset.tag; state.tags.has(t)?state.tags.delete(t):state.tags.add(t); shelf(); });
  $("#sort").onchange = e=>{ state.sort = e.target.value; shelf(); };
  const c = $("#clr"); if(c) c.onclick = ()=>{ state.tags.clear(); state.q=""; $("#q").value=""; shelf(); };
}
function card(r){
  const s = SRC[r.src], m = r.macros;
  const pill = (k, v, label) => `<span class="mpill num"${isEst(r,k)?` title="Estimated"`:""}><b>${isEst(r,k)&&k!=="cal"&&k!=="protein"?"~":""}${v}</b> ${label}</span>`;
  return `<a class="card" href="#r-${r.id}">
    <div class="thumb"><img src="${thumb(r)}" onerror="this.onerror=null;this.src='${r.img}'" alt="${esc(r.title)}" loading="lazy" width="640" height="360"><span class="src">${s.platform}</span>${s.recipes>1?`<span class="part">${r.part} of ${s.recipes}</span>`:""}</div>
    <div class="cbody">
      <h3>${esc(r.title)}</h3>
      <div class="meta"><span>${r.servings} ${pl(r.unit,r.servings)}</span><span>·</span><span>${tlabel(r)}</span></div>
      <div class="tags">${r.tags.slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="macro-strip">${pill("cal",m.cal,"cal")}${pill("protein",m.protein+"g","protein")}${pill("carbs",m.carbs+"g","carbs")}${pill("fiber",m.fiber+"g","fiber")}${pill("sugar",m.sugar+"g","sugar")}</div>
    </div></a>`;
}

/* ---------- grocery selection model ----------
   state.grocery[id] = {sv: servings, ex: [item keys left off]}
   item key = "groupIndex-itemIndex" inside that recipe. */
const itemKeys = r => r.groups.flatMap((g,gi)=>g.items.map((_,ii)=>gi+"-"+ii));
const itemAt = (r,k) => { const [gi,ii]=k.split("-").map(Number); return r.groups[gi].items[ii]; };
const defaultEx = r => itemKeys(r).filter(k=>itemAt(r,k).staple);
function gEntry(id){
  let v = state.grocery[id];
  if(v==null) return null;
  if(typeof v==="number"){ v = {sv:v, ex:[]}; state.grocery[id]=v; }
  if(!Array.isArray(v.ex)) v.ex=[];
  return v;
}
function pickEx(r){ // excluded keys: from the list entry if on it, else from the in-page selection
  const e = gEntry(r.id);
  if(e) return e.ex;
  return state.pick[r.id] || (state.pick[r.id] = defaultEx(r));
}

/* ---------- detail ---------- */
function detail(r){
  const s = SRC[r.src];
  const sv = state.scale[r.id] || gEntry(r.id)?.sv || r.servings, k = sv / r.servings;
  const yv = state.yield[r.id], got = yv ? Math.max(1, Math.round(yv.n * sv / yv.sv)) : sv, f = sv / got;
  const m = {}; for(const x of NUTS){ const v = r.macros[x]; m[x] = v==null ? v : x==="cal" ? Math.round(v*f) : Math.round(v*f*10)/10; }
  const kc = {p:m.protein*4, c:m.carbs*4, f:m.fat*9}, tot = kc.p+kc.c+kc.f;
  const est = x => isEst(r,x) ? ` <span class="est">est.</span>` : "";
  const siblings = RECIPES.filter(x=>x.src===r.src && x.id!==r.id);
  const entry = gEntry(r.id), inList = !!entry;
  const ex = pickEx(r), keys = itemKeys(r), nSel = keys.length - ex.length;
  $("#app").innerHTML = `
    <a class="back" href="#">← All recipes</a>
    <div class="detail">
      <div class="hero">
        <img src="${r.img}" alt="${esc(r.title)}, finished dish">
        <div class="srcline"><span>${s.platform} · ${esc(s.creator)}</span>${s.url?`<a href="${s.url}${r.t&&s.platform==="YouTube"?`&t=${r.t}s`:""}" target="_blank" rel="noopener">${s.linkLabel?esc(s.linkLabel):s.platform==="Instagram"?"Watch on Instagram":r.t?`Watch from ${fmtTime(r.t)}`:"Watch the video"} ↗</a>`:""}${s.extra?`<a href="${s.extra.url}" target="_blank" rel="noopener">${esc(s.extra.label)} ↗</a>`:""}</div>
        <div class="nutri">
          <h3>Nutrition per ${r.unit} <span>${got!==sv?"adjusted for your servings":NUTS.every(x=>!isEst(r,x))?"from the creator":"creator figures + estimates"}</span></h3>
          <div class="yieldrow"><span>${pl(r.unit,2)[0].toUpperCase()+pl(r.unit,2).slice(1)} you got from this batch</span>
            <span class="scaler"><button id="yminus" aria-label="Fewer servings from this batch">−</button><span class="num" id="yv">${got}</span><button id="yplus" aria-label="More servings from this batch">+</button></span></div>
          ${got!==sv?`<p class="ynote">The ingredients for ${sv} ${pl(r.unit,sv)} made ${got}, so each ${r.unit} has ${f>1?"more":"less"} than the recipe says. <button class="linkbtn" id="yreset">Reset to ${sv}</button></p>`:""}
          <div class="bar" role="img" aria-label="Calories split by macro"><i style="width:${kc.p/tot*100}%;background:var(--chili)"></i><i style="width:${kc.c/tot*100}%;background:var(--mustard)"></i><i style="width:${kc.f/tot*100}%;background:var(--basil)"></i></div>
          <div class="nrow">
            <span><i class="dot" style="background:var(--chili)"></i>Protein</span><span class="num">${m.protein} g${est("protein")}</span><span class="num est">${Math.round(kc.p/tot*100)}%</span>
            <span><i class="dot" style="background:var(--mustard)"></i>Carbs</span><span class="num">${m.carbs} g${est("carbs")}</span><span class="num est">${Math.round(kc.c/tot*100)}%</span>
            <span class="sub">Fiber</span><span class="num">${m.fiber} g${est("fiber")}</span><span></span>
            <span class="sub">Total sugars</span><span class="num">${m.sugar} g${est("sugar")}</span><span></span>
            <span class="sub2">incl. added sugars</span><span class="num">${m.addedSugar} g${est("addedSugar")}</span><span></span>
            <span class="sub">Sugar alcohols</span><span class="num">${m.sugarAlcohol} g${est("sugarAlcohol")}</span><span></span>
            <span><i class="dot" style="background:var(--basil)"></i>Fat</span><span class="num">${m.fat} g${est("fat")}</span><span class="num est">${Math.round(kc.f/tot*100)}%</span>
            <i class="sep"></i>
            <span>Net carbs <small class="est">(carbs − fiber)</small></span><span class="num">${Math.max(0, Math.round((m.carbs-(m.fiber||0))*10)/10)} g</span><span></span>
            <span>Protein per 100 cal</span><span class="num">${ppc(r).toFixed(1)} g</span><span></span>
          </div>
          ${["fiber","sugar","addedSugar","sugarAlcohol"].some(x=>isEst(r,x))?`<p class="nfoot">Fiber and sugar figures marked est. are worked out from the ingredient list. Sugar alcohols come from sweeteners like erythritol, monk fruit blends and Swerve.</p>`:""}
        </div>
        ${siblings.length?`<div class="section"><h3 style="font-size:16px">Also in this ${s.platform==="YouTube"?"video":s.platform==="Instagram"?"post":"doc"}</h3><div class="tags">${siblings.map(x=>`<a class="tag" style="text-decoration:none" href="#r-${x.id}">${x.part}. ${esc(x.title)}</a>`).join("")}</div></div>`:""}
      </div>
      <div>
        <div class="dhead"><h2>${esc(r.title)}</h2><div class="from">${s.recipes>1?`Recipe ${r.part} of ${s.recipes} from`:"From"} “${esc(s.title)}”</div></div>
        <div class="stats">
          <div class="stat"><div class="k">Serves</div><div class="v">${r.servings} <small>${pl(r.unit,2)}</small></div></div>
          <div class="stat"><div class="k">Time</div><div class="v">${typeof r.time==="number"?`${r.time} <small>min</small>`:esc(r.time)}</div></div>
          <div class="stat"><div class="k">Calories</div><div class="v">${m.cal} <small>/${r.unit}</small></div></div>
        </div>
        <div class="tags">${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
        <div class="actrow">
          <div class="fgroup"><span class="group-label">Add to plan</span>${DAYS.map((d,i)=>`<button class="chip daychip" data-day="${i}" aria-pressed="${state.plan.days[i].some(e=>e.id===r.id)}">${d}</button>`).join("")}</div>
          <div class="fgroup">${(r.families||[]).filter(f=>FAMILIES[f]).map(f=>`<a class="linkbtn" href="#compare/${slug(f)}">Compare ${FAMILIES[f].length} ${esc(f.toLowerCase())} →</a>`).join("")}
            <button class="linkbtn" id="cmpme">${state.cmp.includes(r.id)?"✓ In my comparison":"+ Add to my comparison"}</button></div>
        </div>

        <div class="section">
          <h3>Ingredients
            <span class="scaler"><button id="minus" aria-label="Fewer servings">−</button><span class="num" id="sv">${sv}</span> ${pl(r.unit,2)}<button id="plus" aria-label="More servings">+</button></span>
          </h3>

          ${r.groups.map((g,gi)=>`<div class="ing-group"><h4>${esc(g.name)}</h4><ul class="ing">${g.items.map((it,ii)=>{ const key=gi+"-"+ii, on=!ex.includes(key); return `
            <li class="${on?"":"off"}"><input type="checkbox" class="pick" id="p-${key}" data-k="${key}" ${on?"checked":""}><label class="q" for="p-${key}">${it.q==null?"to taste":fmtQH(it.q*k)+(it.u?" "+it.u:"")}</label><label class="n" for="p-${key}">${fracText(esc(it.i))}${it.note?` <small>· ${fracText(esc(it.note))}</small>`:""}${it.est?`<span class="flag" title="Not stated in the video">est.</span>`:""}${it.staple?` <small class="staple">pantry staple</small>`:""}</label></li>`;}).join("")}</ul></div>`).join("")}
          <div class="addrow">
            ${inList
              ? `<a class="btn" href="#grocery">✓ ${nSel} item${nSel===1?"":"s"} on grocery list</a><button class="btn ghost" id="rmg">Remove recipe from list</button>`
              : `<button class="btn" id="addg" ${nSel?"":"disabled"}>+ Add ${nSel===keys.length?"all ":""}${nSel} ingredient${nSel===1?"":"s"} to grocery list</button>`}
          </div>
        </div>

        <div class="section">
          <h3>Steps</h3>
          <ol class="steps">${r.steps.map((st,i)=>`<li data-i="${i}" class="${(state.done[r.id]||[]).includes(i)?"done":""}"><div><b>${esc(st[0])}</b>${fracText(esc(st[1]))}</div></li>`).join("")}</ol>
          <p class="est" style="margin-top:8px">Tap a step to check it off while you cook.</p>
        </div>
        <div class="note">${fracText(esc(r.notes))}</div>
        <div class="edit-row"><span>${r.edited?`<span class="edited">Edited by you</span>`:"Spotted a mistake?"}</span><a class="edit-link" href="#edit-${r.id}">Edit recipe</a></div>
      </div>
    </div>`;
  const rerender = () => { const y = window.scrollY; detail(r); window.scrollTo(0, y); };
  const setEx = list => { if(entry){ entry.ex = list; if(list.length===keys.length){ delete state.grocery[r.id]; toast("Removed from grocery list"); } saveG(); } else state.pick[r.id] = list; rerender(); };
  const setSv = v => { state.scale[r.id] = Math.max(1, v); if(entry){ entry.sv=state.scale[r.id]; saveG(); } rerender(); };
  $("#minus").onclick = ()=>setSv(sv-1);
  $("#plus").onclick = ()=>setSv(sv+1);
  const setGot = n => { n = Math.max(1, n); if(n===sv) delete state.yield[r.id]; else state.yield[r.id] = {sv, n}; rerender(); };
  $("#yminus").onclick = ()=>setGot(got-1);
  $("#yplus").onclick = ()=>setGot(got+1);
  const yr = $("#yreset"); if(yr) yr.onclick = ()=>setGot(sv);
  $("#all").onclick = ()=>setEx([]);
  $("#none").onclick = ()=>setEx(keys.slice());
  document.querySelectorAll("input.pick").forEach(cb=>cb.onchange=()=>{
    const cur = pickEx(r).slice(), key = cb.dataset.k;
    setEx(cb.checked ? cur.filter(x=>x!==key) : [...cur, key]);
  });
  const a = $("#addg"); if(a) a.onclick = ()=>{ state.grocery[r.id] = {sv, ex: pickEx(r).slice()}; delete state.pick[r.id]; saveG(); toast(`Added ${nSel} ingredient${nSel===1?"":"s"}`); rerender(); };
  const rm = $("#rmg"); if(rm) rm.onclick = ()=>{ delete state.grocery[r.id]; saveG(); toast("Removed from grocery list"); rerender(); };
  document.querySelectorAll(".chip.daychip").forEach(b=>b.onclick=()=>{
    const d = state.plan.days[+b.dataset.day], at = d.findIndex(e=>e.id===r.id);
    if(at>=0){ d.splice(at,1); toast(`Removed from ${DAYS_LONG[+b.dataset.day]}`); }
    else { d.push({id:r.id, sv}); toast(`Added to ${DAYS_LONG[+b.dataset.day]} · ${sv} ${pl(r.unit,sv)}`); }
    savePlan(); rerender();
  });
  $("#cmpme").onclick = ()=>{
    const at = state.cmp.indexOf(r.id);
    if(at>=0){ state.cmp.splice(at,1); toast("Removed from your comparison"); } else { state.cmp.push(r.id); toast(`Added · ${state.cmp.length} in your comparison`); }
    saveCmp(); rerender();
  };
  document.querySelectorAll(".steps li").forEach(li=>li.onclick=()=>{ const i=+li.dataset.i, d=state.done[r.id]||(state.done[r.id]=[]); const at=d.indexOf(i); at<0?d.push(i):d.splice(at,1); li.classList.toggle("done"); });
  if(!rerender._keep) window.scrollTo(0,0);
}

/* ---------- grocery ---------- */
const AISLES = ["Produce","Meat","Dairy","Bakery","Frozen","International","Baking","Pantry","Household"];
const baseName = s => s.split(",")[0].split(" (")[0];
function groceryItems(){
  const map = new Map();
  for(const id of Object.keys(state.grocery)){
    const r = RECIPES.find(x=>x.id===id), e = gEntry(id); if(!r) continue; const k = e.sv/r.servings;
    r.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{
      const ik = gi+"-"+ii; if(e.ex.includes(ik)) return;
      const key = (baseName(it.i)+"|"+it.u).toLowerCase();
      const row = map.get(key) || {name:baseName(it.i), u:it.u, q:0, a:it.a, from:new Set(), src:[], staple:it.staple};
      if(it.q!=null) row.q += it.q*k;
      row.from.add(r.title); row.src.push([id, ik]); map.set(key, row);
    }));
  }
  return [...map.entries()];
}
function removeRow(row){
  for(const [id, ik] of row.src){
    const e = gEntry(id); if(!e) continue;
    if(!e.ex.includes(ik)) e.ex.push(ik);
    const r = RECIPES.find(x=>x.id===id);
    if(r && e.ex.length >= itemKeys(r).length) delete state.grocery[id];
  }
}
function grocery(){
  const ids = Object.keys(state.grocery);
  const items = groceryItems();
  const byAisle = AISLES.map(a=>[a, items.filter(([,e])=>e.a===a)]).filter(([,l])=>l.length);
  const nGot = items.filter(([key])=>state.got[key]).length;
  $("#app").innerHTML = `
    <div class="gl-head"><h2>Grocery list</h2>
      ${ids.length?`<div class="glbtns">
        <button class="btn" id="copy">Copy list</button>
        <button class="btn ghost" id="rmgot" ${nGot?"":"disabled"}>Remove checked${nGot?` (${nGot})`:""}</button>
        <button class="btn ghost danger" id="clearall">Clear list</button></div>`:""}</div>
    ${ids.length ? `
      <div class="gl-recipes">${ids.map(id=>{const r=RECIPES.find(x=>x.id===id); return r?`<span class="rchip"><a href="#r-${id}">${esc(r.title)} · ${gEntry(id).sv} ${pl(r.unit,2)}</a><button class="x" data-rid="${id}" aria-label="Remove ${esc(r.title)} from list">×</button></span>`:""}).join("")}</div>
      <div class="gl-cols">${byAisle.map(([a,l])=>`<div class="aisle"><h4>${a}</h4>${l.map(([key,e])=>`
        <div class="gi ${state.got[key]?"got":""}"><input type="checkbox" id="g-${esc(key)}" data-k="${esc(key)}" ${state.got[key]?"checked":""}><label for="g-${esc(key)}">${e.q?`<b class="num">${fmtQH(e.q)}${e.u?" "+e.u:""}</b> `:""}${esc(e.name)}<small>${[...e.from].map(esc).join(" · ")}</small></label><button class="x" data-key="${esc(key)}" aria-label="Remove ${esc(e.name)}">×</button></div>`).join("")}</div>`).join("")}</div>
      <p class="est" style="margin-top:12px">Tick items as you shop. Use × to take something off the list entirely. <b>Copy list</b> copies everything you haven't ticked, one item per line and grouped by aisle, so you can paste it into Notes, WhatsApp or anywhere else. In Apple Notes, select the pasted text and tap the checklist button to give every item a tickbox.</p>`
    : `<div class="empty">Your list is empty. Open any recipe, tick the ingredients you need and choose <b>Add to grocery list</b>, or plan your week on the <a href="#plan">Plan</a> page and add the whole week at once.</div>`}`;
  const rows = new Map(items);
  document.querySelectorAll(".gi input").forEach(cb=>cb.onchange=()=>{ state.got[cb.dataset.k]=cb.checked; saveG(); grocery(); });
  document.querySelectorAll(".gi .x").forEach(b=>b.onclick=()=>{ const row=rows.get(b.dataset.key); if(row){ removeRow(row); delete state.got[b.dataset.key]; saveG(); toast(`Removed ${row.name}`); grocery(); } });
  document.querySelectorAll(".rchip .x").forEach(b=>b.onclick=()=>{ delete state.grocery[b.dataset.rid]; saveG(); toast("Recipe removed from list"); grocery(); });
  const rg = $("#rmgot"); if(rg) rg.onclick = ()=>{ for(const [key,row] of items) if(state.got[key]){ removeRow(row); delete state.got[key]; } saveG(); toast("Checked items removed"); grocery(); };
  const ca = $("#clearall"); if(ca) ca.onclick = ()=>{
    if(!ca.dataset.armed){ ca.dataset.armed="1"; ca.textContent="Tap again to clear"; setTimeout(()=>{ if(ca.isConnected){ delete ca.dataset.armed; ca.textContent="Clear list"; } },3000); return; }
    state.grocery={}; state.got={}; saveG(); toast("List cleared"); grocery();
  };
  const qty = e => (e.q?fmtQ(e.q)+(e.u?" "+e.u:"")+" ":"")+e.name;
  const left = byAisle.map(([a,l])=>[a, l.filter(([key])=>!state.got[key])]).filter(([,l])=>l.length);
  // one item per line, grouped by aisle: pastes cleanly into Notes (Checklist), WhatsApp or anywhere
  const notesTxt = left.map(([,l])=>l.map(([,e])=>qty(e)).join("\n")).join("\n\n");
  const c = $("#copy"); if(c) c.onclick = ()=>copyText(notesTxt, "List copied");
}
function fallbackCopy(txt){
  const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("List copied"); }catch(e){ toast("Select the text to copy"); } ta.remove();
}

/* ---------- meal plan ---------- */
const siteUrl = () => location.origin + location.pathname;
function planText(){
  return "🍽️ Meal plan\n\n" + state.plan.days.map((list,di)=>{
    const rows = list.map(e=>{ const r=byId(e.id); return r ? `- ${r.title} (${e.sv} ${pl(r.unit,e.sv)})\n  ${siteUrl()}#r-${r.id}` : ""; }).filter(Boolean);
    return rows.length ? DAYS_LONG[di]+"\n"+rows.join("\n") : "";
  }).filter(Boolean).join("\n\n");
}
const planCode = () => btoa(JSON.stringify(state.plan.days.map(d=>d.map(e=>[e.id,e.sv])))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function readPlanCode(code){
  try{ const days = JSON.parse(atob(code.replace(/-/g,"+").replace(/_/g,"/")));
    if(Array.isArray(days) && days.length===7) return days.map(d=>d.map(([id,sv])=>({id, sv:Math.max(1,+sv||1)})).filter(e=>byId(e.id)));
  }catch(e){}
  return null;
}
function planToGrocery(){
  const tot = {};
  state.plan.days.flat().forEach(e=>{ tot[e.id] = (tot[e.id]||0) + e.sv; });
  for(const [id, sv] of Object.entries(tot)){
    const r = byId(id); if(!r) continue;
    const cur = gEntry(id);
    state.grocery[id] = {sv, ex: cur ? cur.ex : defaultEx(r)};
  }
  saveG(); return Object.keys(tot).length;
}
function planView(shared){
  const days = state.plan.days, total = days.reduce((a,d)=>a+d.length,0);
  const sharedN = shared ? shared.reduce((a,d)=>a+d.length,0) : 0;

    <div class="week">${days.map((list,di)=>{
      const cal = list.reduce((a,e)=>{ const r=byId(e.id); return a + (r? r.macros.cal:0); },0);
      return `<section class="day"><h4>${DAYS_LONG[di]}${list.length?`<small>${list.length} recipe${list.length===1?"":"s"}</small>`:""}</h4>
        ${list.map((e,ei)=>{ const r=byId(e.id); if(!r) return ""; return `
          <div class="pitem"><a href="#r-${r.id}"><img src="${thumb(r)}" alt="" loading="lazy"></a>
            <div><a class="pt" href="#r-${r.id}">${esc(r.title)}</a>
              <div class="pmeta"><button data-act="minus" data-d="${di}" data-e="${ei}" aria-label="Fewer servings">−</button><span class="num">${e.sv}</span> ${pl(r.unit,e.sv)}<button data-act="plus" data-d="${di}" data-e="${ei}" aria-label="More servings">+</button><span>· ${r.macros.cal} cal, ${r.macros.protein} g protein each</span></div></div>
            <button class="x" data-act="del" data-d="${di}" data-e="${ei}" aria-label="Remove ${esc(r.title)}">×</button></div>`; }).join("")}
        <button class="mini" data-act="open" data-d="${di}">+ Add a recipe</button>
        <div class="picker" id="pk-${di}" hidden><input class="fin" data-d="${di}" placeholder="Search recipes…" aria-label="Search recipes to add to ${DAYS_LONG[di]}"><div class="pres" id="pr-${di}"></div></div>
      </section>`; }).join("")}</div>
    ${total?"":`<p class="est" style="margin-top:12px">Tip: you can also add a recipe to any day from the recipe page.</p>`}`;
  const re = ()=>{ const y=scrollY; planView(); scrollTo(0,y); };

  function results(di, q){
    q = q.trim().toLowerCase();
    const hits = (q ? RECIPES.filter(r=>(r.title+" "+r.tags.join(" ")+" "+(r.families||[]).join(" ")).toLowerCase().includes(q)) : RECIPES).slice(0,8);
    $("#pr-"+di).innerHTML = hits.map(r=>`<button data-id="${r.id}"><img src="${thumb(r)}" alt=""><span>${esc(r.title)}</span></button>`).join("") || `<p class="est">No matches.</p>`;

    state.plan.days = [[],[],[],[],[],[],[]]; savePlan(); toast("Week cleared"); re();
  };
}

/* ---------- compare ---------- */
const GOALS = [
  ["ppc",   "Most protein per calorie", r=>ppc(r),             "max", r=>g1(ppc(r))+" g / 100 cal"],
  ["cal",   "Fewest calories",          r=>r.macros.cal,       "min", r=>r.macros.cal+" cal"],
  ["sugar", "Least sugar",              r=>r.macros.sugar,     "min", r=>r.macros.sugar+" g sugar"],
  ["added", "Least added sugar",        r=>r.macros.addedSugar,"min", r=>r.macros.addedSugar+" g added"],
  ["fiber", "Most fiber",               r=>r.macros.fiber,     "max", r=>r.macros.fiber+" g fiber"],
  ["net",   "Lowest net carbs",         r=>net(r),             "min", r=>net(r)+" g net carbs"],
  ["time",  "Quickest",                 r=>mins(r),            "min", r=>tlabel(r)],
  ["ing",   "Fewest ingredients",       r=>nIng(r),            "min", r=>nIng(r)+" ingredients"]
];
const nIng = r => r.groups.reduce((a,g)=>a+g.items.filter(i=>!i.staple && !/^(salt|pepper|black pepper|salt and pepper|water|cooking spray)\b/i.test(i.i)).length,0);
function compareHome(){
  const fams = Object.entries(FAMILIES).sort((a,b)=>b[1].length-a[1].length);
  $("#app").innerHTML = `
    <div class="gl-head"><div><h2>Compare recipes</h2><p class="est">Pick a group of similar recipes to see which is best for your goal at a glance.</p></div></div>
    <div class="famgrid">
      ${state.cmp.length?`<a class="fam" href="#compare/picks" style="border-color:var(--basil)"><b>My comparison</b><span class="est">${state.cmp.length} recipe${state.cmp.length===1?"":"s"} you picked</span><div class="thumbs">${state.cmp.slice(0,3).map(id=>byId(id)).filter(Boolean).map(r=>`<img src="${thumb(r)}" alt="" loading="lazy">`).join("")}</div></a>`:""}
      ${fams.map(([name, ids])=>`<a class="fam" href="#compare/${slug(name)}"><b>${esc(name)}</b><span class="est">${ids.length} recipes</span><div class="thumbs">${ids.slice(0,3).map(id=>byId(id)).filter(Boolean).map(r=>`<img src="${thumb(r)}" alt="" loading="lazy">`).join("")}</div></a>`).join("")}
    </div>
    <p class="est" style="margin-top:14px">Want to compare any recipes, not just a group? Open a recipe and choose <b>+ Add to my comparison</b>.</p>`;
}
function compareView(key){
  let name, ids, picks = key==="picks";
  if(picks){ name = "My comparison"; ids = state.cmp.filter(byId); }
  else { [name, ids] = Object.entries(FAMILIES).find(([n])=>slug(n)===key) || []; }
  if(!name) return compareHome();
  const rs = ids.map(byId).filter(Boolean);
  const per100 = state.basis==="100";
  const sc = r => per100 && r.macros.cal ? 100/r.macros.cal : 1;   // scale macros to 100 cal
  const goal = GOALS.find(g=>g[0]===state.goal) || GOALS[0];
  const sorted = rs.slice().sort((a,b)=> goal[3]==="max" ? goal[2](b)-goal[2](a) : goal[2](a)-goal[2](b));
  const winners = GOALS.map(g=>{ const w = rs.slice().sort((a,b)=> g[3]==="max" ? g[2](b)-g[2](a) : g[2](a)-g[2](b))[0]; return [g, w]; });
  // columns: [goal key or null, label, value fn, best direction]
  const cols = [
    ["cal","Calories", r=>r.macros.cal, "min", r=>r.macros.cal],
    [null,"Protein", r=>r.macros.protein*sc(r), "max"],
    ["ppc","Protein / 100 cal", r=>ppc(r), "max"],
    ["net","Net carbs", r=>net(r)*sc(r), "min"],
    ["fiber","Fiber", r=>r.macros.fiber*sc(r), "max"],
    ["sugar","Sugar", r=>r.macros.sugar*sc(r), "min"],
    ["added","Added sugar", r=>r.macros.addedSugar*sc(r), "min"],
    [null,"Sugar alc.", r=>r.macros.sugarAlcohol*sc(r), null],
    [null,"Fat", r=>r.macros.fat*sc(r), null],
    ["time","Time", r=>mins(r), "min"],
    ["ing","Ingredients", r=>nIng(r), "min"]
  ];
  const fmtv = (c,r) => { const v = c[2](r); if(c[1]==="Time") return v+" min"; if(c[1]==="Ingredients"||c[1]==="Calories") return String(Math.round(v)); return g1(v)+" g"; };
  const best = cols.map(c=> c[3] && rs.length>1 ? (c[3]==="max" ? Math.max(...rs.map(c[2])) : Math.min(...rs.map(c[2]))) : null);
  $("#app").innerHTML = `
    <a class="back" href="#compare">← All comparisons</a>
    <div class="gl-head"><div><h2>${esc(name)}</h2><p class="est">${rs.length} recipes · ★ marks the best in each column · ~ means estimated</p></div>
      <div class="glbtns">${picks?`<button class="btn ghost danger" id="clrpicks">Clear my comparison</button>`:""}</div></div>
    ${rs.length<2?`<div class="empty">Add at least two recipes to compare. Open a recipe and choose <b>+ Add to my comparison</b>.</div>`:`
    <div class="fgroup"><span class="group-label">My goal</span>${GOALS.map(g=>`<button class="chip goal" data-g="${g[0]}" aria-pressed="${g[0]===goal[0]}">${g[1]}</button>`).join("")}</div>
    <div class="wins">${winners.map(([g,w])=>`<a class="win ${g[0]===goal[0]?"sel":""}" href="#r-${w.id}"><img src="${thumb(w)}" alt="" loading="lazy"><div><div class="k">${g[1]}</div><div class="t">${esc(w.title)}</div><div class="v">${g[4](w)}</div></div></a>`).join("")}</div>
    <div class="ftools" style="margin:0 0 8px;justify-content:space-between;width:100%">
      <span>Sorted by <b>${goal[1].toLowerCase()}</b>. Serving sizes differ between creators (a mini roll vs a large roll), so “per 100 cal” is the fairest view.</span>
      <span class="basis" role="group" aria-label="Show amounts"><button data-b="serving" aria-pressed="${!per100}">Per serving</button><button data-b="100" aria-pressed="${per100}">Per 100 cal</button></span>
    </div>
    <div class="tbl-wrap"><table class="cmp">
      <thead><tr><th>#</th><th style="text-align:left">Recipe</th>${cols.map(c=>`<th class="${c[0]===goal[0]?"sel":""}">${c[0]?`<button data-g="${c[0]}" title="Sort by ${esc(c[1].toLowerCase())}">${c[1]}</button>`:c[1]}</th>`).join("")}${picks?"<th></th>":""}</tr></thead>
      <tbody>${sorted.map((r,i)=>`<tr>
        <td class="rank">${i+1}</td>
        <td class="rc"><a href="#r-${r.id}"><img src="${thumb(r)}" alt="" loading="lazy"><span>${esc(r.title)}<small>per ${esc(r.unit)} · ${esc(SRC[r.src].creator)}</small></span></a></td>
        ${cols.map((c,ci)=>{ const v=c[2](r), b = best[ci]!=null && Math.abs(v-best[ci])<1e-9;
          const k = {Calories:"cal",Protein:"protein","Net carbs":"carbs",Fiber:"fiber",Sugar:"sugar","Added sugar":"addedSugar","Sugar alc.":"sugarAlcohol",Fat:"fat"}[c[1]];
          return `<td class="${c[0]===goal[0]?"sel ":""}${b?"best":""}">${k&&isEst(r,k)?"~":""}${per100&&c[1]==="Calories"?"100":fmtv(c,r)}</td>`; }).join("")}
        ${picks?`<td><button class="x" data-rm="${r.id}" aria-label="Remove ${esc(r.title)}">×</button></td>`:""}
      </tr>`).join("")}</tbody></table></div>`}`;
  const re = ()=>{ const y=scrollY; compareView(key); scrollTo(0,y); };
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ state.goal=b.dataset.g; re(); });
  document.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ state.basis=b.dataset.b; re(); });
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ state.cmp=state.cmp.filter(x=>x!==b.dataset.rm); saveCmp(); re(); });
  const cp = $("#clrpicks"); if(cp) cp.onclick = ()=>{ state.cmp=[]; saveCmp(); location.hash="compare"; };
}

/* ---------- editing ----------
   Edits are saved to edits.json in the GitHub repo (pumuki95/recipe-shelf) using a
   GitHub key stored only on this device. Without the key, the editor stays locked. */
const REPO = "pumuki95/recipe-shelf", EDITS_PATH = "edits.json";
const AISLE_OPTS = ["Produce","Meat","Dairy","Bakery","Frozen","International","Baking","Pantry","Household"];
let ORIGINAL = {};          // id -> recipe as built from the videos (before edits)
const ghKey = { get(){ try{ return localStorage.getItem("rs-gh-key")||""; }catch(e){ return ""; } },
                set(v){ try{ v ? localStorage.setItem("rs-gh-key", v) : localStorage.removeItem("rs-gh-key"); }catch(e){} } };
/* Tags worked out from the numbers: Low carb, Low sugar, and High fiber (when not already tagged). */
function normalizeTags(r){
  r.tags = (r.tags||[]).filter(t=>!(r._auto||[]).includes(t) && t!=="Low carb" && t!=="Low sugar");
  const auto = [];
  if(r.macros.carbs <= LOW_CARB_MAX) auto.push("Low carb");
  if(r.macros.sugar != null && r.macros.sugar <= LOW_SUGAR_MAX) auto.push("Low sugar");
  if((r.macros.fiber||0) >= HIGH_FIBER_MIN && !r.tags.includes("High fiber")) auto.push("High fiber");
  r.tags.push(...auto); r._auto = auto;
}
function applyEdits(edits){
  for(const [id, e] of Object.entries((edits&&edits.recipes)||{})){
    const i = RECIPES.findIndex(r=>r.id===id);
    if(i<0) continue;
    if(e.hidden){ RECIPES.splice(i,1); continue; }
    const base = RECIPES[i];
    RECIPES[i] = {...base, ...e.recipe, macros:{...base.macros, ...(e.recipe.macros||{})}, families: base.families, id, src: base.src, edited: e.at};
    normalizeTags(RECIPES[i]);
  }
}
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const unb64 = s => decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
async function gh(method, body){
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${EDITS_PATH}`+(method==="GET"?`?ref=main&t=${Date.now()}`:""), {
    method, headers:{ "Authorization":"Bearer "+ghKey.get(), "Accept":"application/vnd.github+json", ...(body?{"Content-Type":"application/json"}:{}) },
    body: body?JSON.stringify(body):undefined });
  if(method==="GET" && r.status===404) return {missing:true};
  if(r.status===401) throw new Error("GitHub didn't accept the key. It may have expired; unlock again with a new one.");
  if(r.status===403||r.status===404) throw new Error("This key can't write to the recipe-shelf repository. Check it has Contents: Read and write access.");
  if(r.status===409||r.status===422) throw new Error("Someone saved at the same moment. Try Save again.");
  if(!r.ok) throw new Error("GitHub returned an error ("+r.status+"). Try again in a minute.");
  return r.json();
}
async function saveEdit(id, recipe, opts={}){
  const cur = await gh("GET");
  const data = cur.missing ? {version:1, recipes:{}} : JSON.parse(unb64(cur.content));
  data.recipes = data.recipes||{};
  if(opts.revert) delete data.recipes[id];
  else data.recipes[id] = {at:new Date().toISOString(), ...(opts.hidden?{hidden:true}:{recipe})};
  const title = (recipe&&recipe.title)||id;
  await gh("PUT", {message:(opts.revert?"Revert ":opts.hidden?"Hide ":"Edit ")+title+" (from the site)", content:b64(JSON.stringify(data,null,1)), branch:"main", ...(cur.sha?{sha:cur.sha}:{})});
  try{ localStorage.setItem("rs-edits-cache", JSON.stringify({at:Date.now(), data})); }catch(e){}
  return data;
}

/* Unlock screen: one-time setup per device */
function unlockView(r){
  $("#app").innerHTML = `
    <a class="back" href="#r-${r.id}">← Back to recipe</a>
    <div class="howto">
      <h2>Unlock editing</h2>
      <p>Edits are saved to your GitHub project, so they show up on every device and stay put when new recipes are added. To keep the editor from being used by accident, this device needs your GitHub key once.</p>
      <ol>
        <li>On GitHub, open <b>Settings → Developer settings → Personal access tokens → Fine-grained tokens</b> and choose <b>Generate new token</b> (<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">direct link ↗</a>).</li>
        <li>Name it "Recipe Shelf", set an expiration you're happy with, and under <b>Repository access</b> pick <b>Only select repositories → recipe-shelf</b>.</li>
        <li>Under <b>Permissions → Repository permissions</b>, set <b>Contents</b> to <b>Read and write</b>. Leave everything else as is.</li>
        <li>Generate it, copy it, and paste it below.</li>
      </ol>
      <label for="ghk" class="flabel">GitHub key</label>
      <input id="ghk" class="search" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
      <p class="est" style="margin-top:6px">Stays on this device only. Use "Lock editing" on any recipe to remove it.</p>
      <div class="addrow"><button class="btn" id="unl">Unlock</button><a class="btn ghost" href="#r-${r.id}">Cancel</a></div>
      <p id="unlmsg" class="errmsg" role="alert"></p>
    </div>`;
  $("#unl").onclick = async ()=>{
    const v = $("#ghk").value.trim(); if(!v) return;

    try{ await gh("GET"); toast("Editing unlocked"); editView(r); }
    catch(e){ ghKey.set(""); $("#unlmsg").textContent = e.message; $("#unl").disabled = false; }
  };
}

/* The editor form */

  const d = JSON.parse(JSON.stringify(r));     // working copy

  const fld = (id,label,val,attrs="") => `<label class="flabel" for="${id}">${label}</label><input id="${id}" class="fin" value="${esc(val??"")}" ${attrs}>`;

              <div class="eitems">${g.items.map((it,ii)=>`

                <button class="x" data-act="dels" data-s="${si}" aria-label="Remove step ${si+1}">×</button>
              </div>
            </div>`).join("")}
          <button class="mini" data-act="adds">+ Add step</button>

        <section class="danger-zone"><h3>More</h3>
          <div class="addrow">
            ${ORIGINAL[r.id] && r.edited ? `<button class="btn ghost" id="e-revert">Undo all my edits to this recipe</button>`:""}
            <button class="btn ghost danger" id="e-hide">Remove recipe from the shelf</button>

        </div>
      </div>`;
    wire();
  }
  function collect(){
    const v = id => $("#"+id).value;
    d.title = v("e-title").trim() || d.title;
    d.servings = Math.max(1, Math.round(+v("e-serv")||d.servings));
    d.unit = v("e-unit").trim() || d.unit;
    d.time = Math.max(0, Math.round(+v("e-time")||0));
    d.macros = {cal:+v("e-cal")||0, protein:+v("e-pro")||0, carbs:+v("e-carb")||0, fat:+v("e-fat")||0,
                fiber:+v("e-fib")||0, sugar:+v("e-sug")||0, addedSugar:+v("e-add")||0, sugarAlcohol:+v("e-sa")||0};

    else if(NUTS.every(k=>d.stated.includes(k))){ const o = (ORIGINAL[r.id]||r).stated; d.stated = NUTS.every(k=>o.includes(k)) ? [] : o.slice(); }
    d.tags = v("e-tags").split(",").map(t=>t.trim()).filter(Boolean);
    document.querySelectorAll("[data-f]").forEach(el=>{
      const g = el.dataset.g, i = el.dataset.i, s = el.dataset.s, f = el.dataset.f;
      if(f==="gname") d.groups[g].name = el.value;
      else if(i!==undefined){
        const it = d.groups[g].items[i];
        if(f==="q"){ const t = el.value.trim().replace(",", "."); const fr = t.match(/^(\d+)?\s*(\d+)\/(\d+)$/); it.q = t==="" ? null : fr ? (+(fr[1]||0) + fr[2]/fr[3]) : (isNaN(+t) ? it.q : +t); }
        else if(f==="staple") it.staple = el.checked || undefined;
        else if(f==="note") it.note = el.value.trim() || undefined;
        else it[f] = el.value;
        if(f==="i"||f==="q"||f==="u") delete it.est;
      }
      else if(s!==undefined){ if(f==="st") d.steps[s][0] = el.value; else d.steps[s][1] = el.value; }
    });
    d.notes = v("e-notes");
  }
  function changed(){ dirty = true; window.__editDirty = true; const b=$("#e-save"); if(b) b.disabled=false; const m=$("#sbmsg"); if(m) m.textContent="You have unsaved changes."; }
  function wire(){
    document.querySelectorAll(".eform input, .eform textarea, .eform select").forEach(el=>el.addEventListener("input", changed));
    document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
      collect(); const g=+b.dataset.g, i=+b.dataset.i, s=+b.dataset.s;
      switch(b.dataset.act){
        case "addi": d.groups[g].items.push({q:null,u:"",i:"",a:"Pantry"}); break;
        case "deli": d.groups[g].items.splice(i,1); break;
        case "addg": d.groups.push({name:"New group", items:[{q:null,u:"",i:"",a:"Pantry"}]}); break;
        case "delg": d.groups.splice(g,1); break;
        case "adds": d.steps.push(["",""]); break;
        case "dels": d.steps.splice(s,1); break;
        case "up": [d.steps[s-1],d.steps[s]]=[d.steps[s],d.steps[s-1]]; break;
        case "down": [d.steps[s+1],d.steps[s]]=[d.steps[s],d.steps[s+1]]; break;
      }
      dirty = true; window.__editDirty = true; const y=scrollY; render(); scrollTo(0,y);
    });
    $("#e-cancel").onclick = ()=>{
      if(!dirty) return void (location.hash = "r-"+r.id);
      confirmBar("Discard your unsaved changes?", "Discard", ()=>{ dirty = false; window.__editDirty = false; location.hash = "r-"+r.id; });
    };
    $("#e-save").onclick = ()=>{
      collect();
      d.groups.forEach(g=>g.items = g.items.filter(it=>it.i.trim()));
      d.steps = d.steps.filter(s=>(s[0]+s[1]).trim());
      confirmBar(`Save changes to "${d.title}"? They'll be live on the site within a couple of minutes.`, "Yes, save", async ()=>{
        await persist(()=>saveEdit(r.id, stripRecipe(d)), "Saved");
      });
    };
    $("#e-hide").onclick = ()=> confirmBar(`Remove "${r.title}" from your shelf? You can ask Claude to bring it back later.`, "Remove recipe", async ()=>{
      await persist(()=>saveEdit(r.id, r, {hidden:true}), "Recipe removed", "#");
    }, true);
    const rv = $("#e-revert"); if(rv) rv.onclick = ()=> confirmBar("Undo all your edits and go back to the version from the video?", "Undo my edits", async ()=>{
      await persist(()=>saveEdit(r.id, r, {revert:true}), "Edits undone");
    }, true);
    $("#e-lock").onclick = ()=>{ ghKey.set(""); toast("Editing locked on this device"); location.hash = "r-"+r.id; };
  }
  async function persist(fn, okMsg, goTo){
    $("#savebar .sb-in").innerHTML = `<span id="sbmsg">Saving…</span>`; const m = $("#sbmsg");
    try{
      const data = await fn();
      dirty = false; window.__editDirty = false;
      await reloadRecipes(data);
      toast(okMsg); const target = goTo || ("#r-"+r.id); if(location.hash===target || (target==="#" && !location.hash)) route(); else location.hash = target;
    }catch(e){ const y=scrollY; render(); scrollTo(0,y); $("#sbmsg").innerHTML = `<span class="errmsg">Not saved. ${esc(e.message)}</span>`; }
  }
  function confirmBar(text, yes, onYes, danger){
    const sb = $("#savebar .sb-in");
    sb.innerHTML = `<span><b>${esc(text)}</b></span><div class="addrow"><button class="btn ghost" id="cb-no">Go back</button><button class="btn ${danger?"dangerfill":""}" id="cb-yes">${esc(yes)}</button></div>`;
    $("#cb-no").onclick = ()=>{ const y=scrollY; render(); scrollTo(0,y); };
    $("#cb-yes").onclick = ()=>{ $("#cb-yes").disabled = true; onYes(); };
    $("#cb-yes").focus();
  }
  window.__editDirty = false;
  render();
}
function stripRecipe(d){
  const {id, src, edited, families, _auto, ...rest} = d;
  rest.tags = rest.tags.filter(t=>!(_auto||[]).includes(t) && t!=="Low carb" && t!=="Low sugar");
  return rest;
}
async function reloadRecipes(edits){
  const data = await fetch("recipes.json",{cache:"no-cache"}).then(r=>r.json());
  RECIPES = data.recipes; ORIGINAL = Object.fromEntries(data.recipes.map(r=>[r.id, JSON.parse(JSON.stringify(r))]));
  RECIPES.forEach(normalizeTags);
  applyEdits(edits);
  $("#tally").textContent = RECIPES.length + " recipes · " + data.sources.length + " videos";
}
async function loadEdits(){
  let remote = null;
  try{ const r = await fetch(EDITS_PATH, {cache:"no-cache"}); if(r.ok) remote = await r.json(); }catch(e){}
  // A just-saved edit can take a minute or two to reach the live site; prefer the newer local copy meanwhile.
  try{
    const c = JSON.parse(localStorage.getItem("rs-edits-cache")||"null");
    if(c && Date.now()-c.at < 3*60*1000) remote = c.data;
  }catch(e){}
  return remote;
}

/* ---------- router ---------- */
function route(){
  const h = location.hash.slice(1);
  ["shelf","plan","compare","grocery"].forEach(n=>$("#nav-"+n).removeAttribute("aria-current"));
  if(h==="add"){ history.replaceState(null,"","#"); }
  if(h.startsWith("plan")){ $("#nav-plan").setAttribute("aria-current","page"); const code = h.startsWith("plan=") ? readPlanCode(h.slice(5)) : null; return planView(code); }
  if(h.startsWith("compare")){ $("#nav-compare").setAttribute("aria-current","page"); window.scrollTo(0,0); return h.startsWith("compare/") ? compareView(h.slice(8)) : compareHome(); }
  if(h.startsWith("edit-")){ const r = RECIPES.find(x=>x.id===h.slice(5)); if(r){ $("#nav-shelf").setAttribute("aria-current","page"); window.scrollTo(0,0); return editView(r); } }
  if(h.startsWith("r-")){ const r = RECIPES.find(x=>x.id===h.slice(2)); if(r){ $("#nav-shelf").setAttribute("aria-current","page"); state.yield = {}; return detail(r); } }
  if(h==="grocery"){ $("#nav-grocery").setAttribute("aria-current","page"); return grocery(); }
  $("#nav-shelf").setAttribute("aria-current","page"); shelf();
}
function boot(data, edits){
  SRC = Object.fromEntries(data.sources.map(s=>[s.key, s]));
  FAMILIES = data.families || {};
  RECIPES = data.recipes;
  ORIGINAL = Object.fromEntries(RECIPES.map(r=>[r.id, JSON.parse(JSON.stringify(r))]));
  RECIPES.forEach(normalizeTags);
  applyEdits(edits);
  $("#tally").textContent = RECIPES.length + " recipes · " + data.sources.length + " videos";
  gcount(); pcount();
  route();
}
applyTheme((()=>{ try{ return localStorage.getItem("rs-theme")||"auto"; }catch(e){ return "auto"; } })());
$("#theme").onclick = cycleTheme;
$("#q").addEventListener("input", e=>{
  state.q = e.target.value;
  const h = location.hash.slice(1);
  if(h && h!=="") { if(state.q.trim()) location.hash = ""; return; }
  shelf();
});
let lastHash = location.hash;
window.addEventListener("hashchange", ()=>{
  if(window.__editDirty && !location.hash.startsWith("#edit-")){
    if(!confirm("You have unsaved changes to this recipe. Leave without saving?")){ history.replaceState(null,"",lastHash); return; }
    window.__editDirty = false;
  }
  lastHash = location.hash;
  if(RECIPES.length) route();
});
window.addEventListener("beforeunload", e=>{ if(window.__editDirty){ e.preventDefault(); e.returnValue = ""; } });
$("#app").innerHTML = `<div class="empty">Loading recipes…</div>`;
Promise.all([fetch("recipes.json", {cache:"no-cache"}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }), loadEdits()]).then(([d,e])=>boot(d,e))
  .catch(()=>{ $("#app").innerHTML = `<div class="empty">Couldn't load the recipes. Check your connection and refresh the page.</div>`; });
</script>
