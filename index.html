<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Recipe Shelf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a kitchen shelf of video-sourced recipe cards; each opens a full cook sheet; a shared grocery list collects from any card. */
:root{
  --bg:#F3F5F0; --paper:#FFFFFF; --ink:#18201A; --muted:#5D685F; --line:#DCE2D9;
  --basil:#2E6A41; --basil-soft:#E1EEE3; --mustard:#E2A62B; --mustard-soft:#FBF0D6; --chili:#B8432E;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111612; --paper:#1A211C; --ink:#E9EEE8; --muted:#9AA79C; --line:#2C362E;
  --basil:#7CC48F; --basil-soft:#1F3326; --mustard:#F0BB4D; --mustard-soft:#3A2F14; --chili:#EE8670; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111612; --paper:#1A211C; --ink:#E9EEE8; --muted:#9AA79C; --line:#2C362E;
  --basil:#7CC48F; --basil-soft:#1F3326; --mustard:#F0BB4D; --mustard-soft:#3A2F14; --chili:#EE8670; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto}
a{color:var(--basil)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--basil);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink)}
.brand h1{font-size:clamp(26px,4vw,34px);font-weight:800}
.brand span{font-family:var(--mono);font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);display:flex;gap:6px;align-items:center}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-family:var(--mono);font-size:12px;background:var(--mustard);color:#1d1606;border-radius:999px;padding:0 7px;min-width:20px;text-align:center}

/* filters */
.filters{display:flex;flex-direction:column;gap:10px;padding:6px 0 18px}
.search{width:100%;max-width:420px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--basil);border-color:var(--basil);color:var(--bg)}
.group-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:4px;align-self:center}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px -12px rgba(0,0,0,.35)}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.src{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:11px;background:rgba(10,14,11,.78);color:#fff;padding:3px 8px;border-radius:6px}
.part{position:absolute;right:10px;top:10px;font-family:var(--mono);font-size:11px;background:var(--mustard);color:#1d1606;padding:3px 8px;border-radius:6px;font-weight:500}
.cbody{padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cbody h3{font-size:18px;font-weight:700;line-height:1.2}
.meta{display:flex;gap:12px;color:var(--muted);font-size:13px}
.macro-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.mpill{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:6px;background:var(--mustard-soft);color:var(--ink)}
.mpill b{font-weight:500;color:var(--chili)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--basil-soft);color:var(--basil);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* detail */
.back{display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-weight:600;margin:4px 0 14px}
.detail{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
.hero img{width:100%;border-radius:var(--r);display:block;aspect-ratio:16/9;object-fit:cover}
.hero .srcline{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.dhead h2{font-size:clamp(28px,4.4vw,42px);font-weight:800;line-height:1.05}
.dhead .from{font-size:13px;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:18px 0 14px}
.stat{background:var(--paper);padding:10px 12px}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--muted)}
.nutri{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.nutri h3{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.nutri h3 span{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line);margin:8px 0 10px}
.bar i{display:block}
.nrow{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-size:14px}
.nrow .num{text-align:right}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle}
.est{font-size:11px;color:var(--muted);font-family:var(--mono)}
.section{margin-top:28px}
.section h3{font-size:22px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.scaler{display:flex;align-items:center;gap:8px;font-family:var(--body);font-size:13px;font-weight:500}
.scaler button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:16px;line-height:1}
.ing-group{margin-bottom:14px}
.ing-group h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:grid;grid-template-columns:22px 92px minmax(0,1fr);gap:10px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line)}
.ing li.off .q,.ing li.off .n{opacity:.45}
.ing input.pick{margin:3px 0 0;width:16px;height:16px;accent-color:var(--basil)}
.ing label{cursor:pointer}
.staple{color:var(--muted);font-size:11px;font-family:var(--mono)}
.pickbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-2px 0 10px}
.linkbtn{background:none;border:none;padding:0;color:var(--basil);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{text-decoration:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--chili)}
.glbtns{display:flex;gap:8px;flex-wrap:wrap}
.rchip{display:inline-flex;align-items:center;gap:2px;background:var(--basil-soft);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;font-weight:600}
.rchip a{color:var(--basil);text-decoration:none}
.x{background:none;border:none;color:var(--muted);font-size:18px;line-height:1;width:28px;height:28px;border-radius:8px;flex:none}
.x:hover{background:var(--line);color:var(--chili)}
.gi{align-items:center}
.gi label{flex:1;min-width:0;cursor:pointer}
.ing .q{font-family:var(--mono);font-size:13px;color:var(--basil);font-variant-numeric:tabular-nums}
.ing .n small{color:var(--muted)}
.flag{font-size:10px;font-family:var(--mono);color:var(--chili);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:4px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--basil);color:var(--bg)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:20px;width:34px;height:34px;border-radius:50%;background:var(--basil-soft);color:var(--basil);display:grid;place-items:center}
.steps li.done{opacity:.45}
.steps li.done::before{content:"✓"}
.steps b{display:block;font-family:var(--display);font-size:16px}
.note{background:var(--mustard-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* grocery */
.gl-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.gl-head h2{font-size:clamp(26px,4vw,36px);font-weight:800}
.gl-recipes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.gl-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.aisle{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.aisle h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--basil)}
.gi{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.gi:last-child{border-bottom:none}
.gi input{margin-top:3px;accent-color:var(--basil);width:16px;height:16px}
.gi.got label{text-decoration:line-through;color:var(--muted)}
.gi small{display:block;color:var(--muted);font-size:12px}

/* how to add */
.howto{max-width:680px}
.howto h2{font-size:clamp(26px,4vw,36px);font-weight:800;margin-bottom:10px}
.howto ol{padding-left:20px}
.howto li{margin-bottom:8px}
.copybox{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;margin:12px 0}

@media (max-width:780px){
  .detail{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* editor */
.edit-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.edit-link{color:var(--muted);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.edited{font-family:var(--mono);font-size:11px;background:var(--basil-soft);color:var(--basil);border-radius:6px;padding:2px 7px}
.editbar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--mustard-soft);border-radius:12px;padding:12px 14px;margin:6px 0 18px}
.eform{display:flex;flex-direction:column;gap:22px;max-width:860px}
.eform section{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.eform h3{font-size:17px;margin-bottom:10px}
.flabel{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.fin{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;min-width:0}
textarea.fin{resize:vertical;line-height:1.45}
.erow3,.erow4{display:grid;gap:10px}
.erow3{grid-template-columns:repeat(3,minmax(0,1fr))}
.erow4{grid-template-columns:repeat(4,minmax(0,1fr))}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:10px}
.chk input{accent-color:var(--basil);width:16px;height:16px}
.chk.sm{font-size:12px;margin:0;white-space:nowrap;color:var(--muted)}
.egroup{border-top:1px dashed var(--line);padding:12px 0}
.egroup:first-of-type{border-top:none;padding-top:0}
.egh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.egh .fin{font-weight:700}
.eitems{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.eitem{display:grid;grid-template-columns:70px 70px minmax(0,2fr) minmax(0,1.3fr) 112px auto 28px;gap:6px;align-items:center}
.estep{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.snum{font-family:var(--display);font-weight:800;font-size:18px;color:var(--basil);padding-top:6px}
.sfields{display:flex;flex-direction:column;gap:6px}
.sbtns{display:flex;flex-direction:column;gap:4px}
.mini{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;margin-top:6px}
.mini[disabled]{opacity:.35;cursor:not-allowed}
.savebar{position:sticky;bottom:0;margin-top:22px;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.sb-in{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
.sb-in .btn.ghost{color:var(--bg);border-color:rgba(255,255,255,.35)}
.btn.dangerfill{background:var(--chili);color:#fff}
.errmsg{color:var(--chili);font-weight:600}
.sb-in .errmsg{color:#ffb4a3}
.danger-zone{background:transparent !important}
@media (max-width:780px){
  .erow3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .erow4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .eitem{grid-template-columns:64px 64px minmax(0,1fr) 28px;}
  .eitem .nt{grid-column:1 / 4}
  .eitem .a{grid-column:1 / 3}
  .eitem .chk{grid-column:3 / 5}
  .eitem .x{grid-row:1;grid-column:4}
}
@media (prefers-reduced-motion:reduce){.card,.toast{transition:none}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <a class="brand" href="#"><h1>The Recipe Shelf</h1><span id="tally"></span></a>
    <nav class="tabs" aria-label="Sections">
      <a href="#" id="nav-shelf">Recipes</a>
      <a href="#grocery" id="nav-grocery">Grocery list <span class="count num" id="gcount">0</span></a>
      <a href="#add" id="nav-add">Add</a>
    </nav>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Recipes live in recipes.json (built from data/*.json); photos in img/. */
let SRC = {}, RECIPES = [];
/* ---------- helpers ---------- */
const pl = (u,n) => n===1 ? u : ({half:"halves",serving:"servings"}[u] || (/(ch|sh|s|x)$/.test(u) ? u+"es" : u+"s"));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let state = {
  q:"", tags:new Set(),
  grocery: store.get("rs-grocery", {}),   // id -> servings
  got: store.get("rs-got", {}),
  scale: {}, done: {}, pick: {}
};
const fmtTime = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const FR = [[.125,"⅛"],[.25,"¼"],[.333,"⅓"],[.5,"½"],[.667,"⅔"],[.75,"¾"]];
function fmtQ(n){
  if(n==null) return "";
  if(n >= 20) return String(Math.round(n));
  const w = Math.floor(n), f = n - w;
  if(f < .06) return String(w);
  if(f > .94) return String(w+1);
  let best = FR.reduce((a,b)=> Math.abs(b[0]-f) < Math.abs(a[0]-f) ? b : a);
  if(Math.abs(best[0]-f) < .06) return (w ? w : "") + best[1];
  return (Math.round(n*10)/10).toString();
}
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast._); toast._=setTimeout(()=>t.classList.remove("on"),1800); }
function gcount(){ $("#gcount").textContent = Object.keys(state.grocery).length; }
function saveG(){ store.set("rs-grocery", state.grocery); store.set("rs-got", state.got); gcount(); }

/* ---------- shelf ---------- */
const FILTERS = [
  ["Meal", ["Breakfast","Main meal","Side dish","Snack","Dessert"]],
  ["Protein", ["Ground beef","Chicken","Pork","Fish","Eggs","Plant-based"]],
  ["Carb", ["Rice","Pasta","Noodles","Bread","Pizza","Tortillas","Potatoes"]],
  ["Diet", ["High protein","Low carb","High fiber","Gluten-free","No-bake","Meal prep"]]
];
const LOW_CARB_MAX = 20; /* grams of carbs per serving */
const ALWAYS = ["Low carb","Breakfast","Main meal","Side dish","Snack","Dessert"];
function shelf(){
  const allTags = new Set(RECIPES.flatMap(r=>r.tags));
  const list = RECIPES.filter(r=>{
    const hay = (r.title+" "+r.tags.join(" ")+" "+r.groups.flatMap(g=>g.items.map(i=>i.i)).join(" ")).toLowerCase();
    if(state.q && !hay.includes(state.q.toLowerCase())) return false;
    for(const t of state.tags) if(!r.tags.includes(t)) return false;
    return true;
  });
  const chipRows = FILTERS.map(([label, opts])=>{
    const present = opts.filter(o=>allTags.has(o) || ALWAYS.includes(o));
    if(!present.length) return "";
    return `<div class="chiprow"><span class="group-label">${label}</span>${present.map(o=>`<button class="chip" data-tag="${esc(o)}" aria-pressed="${state.tags.has(o)}">${esc(o)}</button>`).join("")}</div>`;
  }).join("");
  $("#app").innerHTML = `
    <div class="filters">
      <input id="q" class="search" type="search" placeholder="Search recipes or ingredients" value="${esc(state.q)}" aria-label="Search recipes">
      ${chipRows}
    </div>
    <div class="grid">${list.length ? list.map(card).join("") : `<div class="empty">No recipes match those filters.${state.tags.has("Low carb")?` Low carb means ${LOW_CARB_MAX} g of carbs or less per serving.`:""}</div>`}</div>`;
  $("#q").addEventListener("input", e=>{ state.q=e.target.value; const pos=e.target.selectionStart; shelf(); const q=$("#q"); q.focus(); q.setSelectionRange(pos,pos); });
  document.querySelectorAll(".chip[data-tag]").forEach(b=>b.onclick=()=>{ const t=b.dataset.tag; state.tags.has(t)?state.tags.delete(t):state.tags.add(t); shelf(); });
}
function card(r){
  const s = SRC[r.src];
  return `<a class="card" href="#r-${r.id}">
    <div class="thumb"><img src="${r.img}" alt="${esc(r.title)}" loading="lazy" width="640" height="360"><span class="src">${s.platform}</span>${s.recipes>1?`<span class="part">${r.part} of ${s.recipes}</span>`:""}</div>

}

/* ---------- grocery selection model ----------
   state.grocery[id] = {sv: servings, ex: [item keys left off]}
   item key = "groupIndex-itemIndex" inside that recipe. */
const itemKeys = r => r.groups.flatMap((g,gi)=>g.items.map((_,ii)=>gi+"-"+ii));
const itemAt = (r,k) => { const [gi,ii]=k.split("-").map(Number); return r.groups[gi].items[ii]; };
const defaultEx = r => itemKeys(r).filter(k=>itemAt(r,k).staple);
function gEntry(id){
  let v = state.grocery[id];
  if(v==null) return null;
  if(typeof v==="number"){ v = {sv:v, ex:[]}; state.grocery[id]=v; }
  if(!Array.isArray(v.ex)) v.ex=[];
  return v;
}
function pickEx(r){ // excluded keys: from the list entry if on it, else from the in-page selection
  const e = gEntry(r.id);
  if(e) return e.ex;
  return state.pick[r.id] || (state.pick[r.id] = defaultEx(r));
}

/* ---------- grocery ---------- */
const AISLES = ["Produce","Meat","Dairy","Bakery","Frozen","International","Baking","Pantry","Household"];
const baseName = s => s.split(",")[0].split(" (")[0];
function groceryItems(){
  const map = new Map();
  for(const id of Object.keys(state.grocery)){
    const r = RECIPES.find(x=>x.id===id), e = gEntry(id); if(!r) continue; const k = e.sv/r.servings;
    r.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{
      const ik = gi+"-"+ii; if(e.ex.includes(ik)) return;
      const key = (baseName(it.i)+"|"+it.u).toLowerCase();
      const row = map.get(key) || {name:baseName(it.i), u:it.u, q:0, a:it.a, from:new Set(), src:[], staple:it.staple};
      if(it.q!=null) row.q += it.q*k;
      row.from.add(r.title); row.src.push([id, ik]); map.set(key, row);
    }));
  }
  return [...map.entries()];
}
function removeRow(row){
  for(const [id, ik] of row.src){
    const e = gEntry(id); if(!e) continue;
    if(!e.ex.includes(ik)) e.ex.push(ik);
    const r = RECIPES.find(x=>x.id===id);
    if(r && e.ex.length >= itemKeys(r).length) delete state.grocery[id];
  }
}
function grocery(){
  const ids = Object.keys(state.grocery);
  const items = groceryItems();
  const byAisle = AISLES.map(a=>[a, items.filter(([,e])=>e.a===a)]).filter(([,l])=>l.length);
  const nGot = items.filter(([key])=>state.got[key]).length;
  $("#app").innerHTML = `
    <div class="gl-head"><h2>Grocery list</h2>
      ${ids.length?`<div class="glbtns">
        <button class="btn ghost" id="copy">Copy list</button>
        <button class="btn ghost" id="rmgot" ${nGot?"":"disabled"}>Remove checked${nGot?` (${nGot})`:""}</button>
        <button class="btn ghost danger" id="clearall">Clear list</button></div>`:""}</div>
    ${ids.length ? `
      <div class="gl-recipes">${ids.map(id=>{const r=RECIPES.find(x=>x.id===id); return r?`<span class="rchip"><a href="#r-${id}">${esc(r.title)} · ${gEntry(id).sv} ${pl(r.unit,2)}</a><button class="x" data-rid="${id}" aria-label="Remove ${esc(r.title)} from list">×</button></span>`:""}).join("")}</div>
      <div class="gl-cols">${byAisle.map(([a,l])=>`<div class="aisle"><h4>${a}</h4>${l.map(([key,e])=>`
        <div class="gi ${state.got[key]?"got":""}"><input type="checkbox" id="g-${esc(key)}" data-k="${esc(key)}" ${state.got[key]?"checked":""}><label for="g-${esc(key)}">${e.q?`<b class="num">${fmtQ(e.q)}${e.u?" "+e.u:""}</b> `:""}${esc(e.name)}<small>${[...e.from].map(esc).join(" · ")}</small></label><button class="x" data-key="${esc(key)}" aria-label="Remove ${esc(e.name)}">×</button></div>`).join("")}</div>`).join("")}</div>
      <p class="est" style="margin-top:12px">Tick items as you shop. Use × to take something off the list entirely.</p>`
    : `<div class="empty">Your list is empty. Open any recipe, tick the ingredients you need and choose <b>Add to grocery list</b>; quantities follow the servings you pick.</div>`}`;
  const rows = new Map(items);
  document.querySelectorAll(".gi input").forEach(cb=>cb.onchange=()=>{ state.got[cb.dataset.k]=cb.checked; saveG(); grocery(); });
  document.querySelectorAll(".gi .x").forEach(b=>b.onclick=()=>{ const row=rows.get(b.dataset.key); if(row){ removeRow(row); delete state.got[b.dataset.key]; saveG(); toast(`Removed ${row.name}`); grocery(); } });
  document.querySelectorAll(".rchip .x").forEach(b=>b.onclick=()=>{ delete state.grocery[b.dataset.rid]; saveG(); toast("Recipe removed from list"); grocery(); });
  const rg = $("#rmgot"); if(rg) rg.onclick = ()=>{ for(const [key,row] of items) if(state.got[key]){ removeRow(row); delete state.got[key]; } saveG(); toast("Checked items removed"); grocery(); };
  const ca = $("#clearall"); if(ca) ca.onclick = ()=>{
    if(!ca.dataset.armed){ ca.dataset.armed="1"; ca.textContent="Tap again to clear"; setTimeout(()=>{ if(ca.isConnected){ delete ca.dataset.armed; ca.textContent="Clear list"; } },3000); return; }
    state.grocery={}; state.got={}; saveG(); toast("List cleared"); grocery();
  };
  const c = $("#copy"); if(c) c.onclick = ()=>{
    const txt = byAisle.map(([a,l])=>a.toUpperCase()+"\n"+l.filter(([key])=>!state.got[key]).map(([,e])=>"- "+(e.q?fmtQ(e.q)+(e.u?" "+e.u:"")+" ":"")+e.name).join("\n")).join("\n\n");
    try{ navigator.clipboard.writeText(txt).then(()=>toast("List copied"), ()=>fallbackCopy(txt)); }catch(e){ fallbackCopy(txt); }
  };
}
function fallbackCopy(txt){
  const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("List copied"); }catch(e){ toast("Select the text to copy"); } ta.remove();
}

/* ---------- editing ----------
   Edits are saved to edits.json in the GitHub repo (pumuki95/recipe-shelf) using a
   GitHub key stored only on this device. Without the key, the editor stays locked. */
const REPO = "pumuki95/recipe-shelf", EDITS_PATH = "edits.json";
const AISLE_OPTS = ["Produce","Meat","Dairy","Bakery","Frozen","International","Baking","Pantry","Household"];
let ORIGINAL = {};          // id -> recipe as built from the videos (before edits)
const ghKey = { get(){ try{ return localStorage.getItem("rs-gh-key")||""; }catch(e){ return ""; } },
                set(v){ try{ v ? localStorage.setItem("rs-gh-key", v) : localStorage.removeItem("rs-gh-key"); }catch(e){} } };
function normalizeTags(r){
  r.tags = (r.tags||[]).filter(t=>t!=="Low carb");
  if(r.macros.carbs <= LOW_CARB_MAX) r.tags.push("Low carb");
}
function applyEdits(edits){
  for(const [id, e] of Object.entries((edits&&edits.recipes)||{})){
    const i = RECIPES.findIndex(r=>r.id===id);
    if(i<0) continue;
    if(e.hidden){ RECIPES.splice(i,1); continue; }
    RECIPES[i] = {...RECIPES[i], ...e.recipe, id, src: RECIPES[i].src, edited: e.at};
    normalizeTags(RECIPES[i]);
  }
}
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const unb64 = s => decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
async function gh(method, body){
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${EDITS_PATH}`+(method==="GET"?`?ref=main&t=${Date.now()}`:""), {
    method, headers:{ "Authorization":"Bearer "+ghKey.get(), "Accept":"application/vnd.github+json", ...(body?{"Content-Type":"application/json"}:{}) },
    body: body?JSON.stringify(body):undefined });
  if(method==="GET" && r.status===404) return {missing:true};
  if(r.status===401) throw new Error("GitHub didn't accept the key. It may have expired; unlock again with a new one.");
  if(r.status===403||r.status===404) throw new Error("This key can't write to the recipe-shelf repository. Check it has Contents: Read and write access.");
  if(r.status===409||r.status===422) throw new Error("Someone saved at the same moment. Try Save again.");
  if(!r.ok) throw new Error("GitHub returned an error ("+r.status+"). Try again in a minute.");
  return r.json();
}
async function saveEdit(id, recipe, opts={}){
  const cur = await gh("GET");
  const data = cur.missing ? {version:1, recipes:{}} : JSON.parse(unb64(cur.content));
  data.recipes = data.recipes||{};
  if(opts.revert) delete data.recipes[id];
  else data.recipes[id] = {at:new Date().toISOString(), ...(opts.hidden?{hidden:true}:{recipe})};
  const title = (recipe&&recipe.title)||id;
  await gh("PUT", {message:(opts.revert?"Revert ":opts.hidden?"Hide ":"Edit ")+title+" (from the site)", content:b64(JSON.stringify(data,null,1)), branch:"main", ...(cur.sha?{sha:cur.sha}:{})});
  try{ localStorage.setItem("rs-edits-cache", JSON.stringify({at:Date.now(), data})); }catch(e){}
  return data;
}

                  <input class="fin q" data-g="${gi}" data-i="${ii}" data-f="q" value="${it.q??""}" placeholder="qty" aria-label="Quantity" inputmode="decimal">
                  <input class="fin u" data-g="${gi}" data-i="${ii}" data-f="u" value="${esc(it.u)}" placeholder="unit" aria-label="Unit">
                  <input class="fin n" data-g="${gi}" data-i="${ii}" data-f="i" value="${esc(it.i)}" placeholder="ingredient" aria-label="Ingredient">
                  <input class="fin nt" data-g="${gi}" data-i="${ii}" data-f="note" value="${esc(it.note||"")}" placeholder="note (optional)" aria-label="Note">
                  <select class="fin a" data-g="${gi}" data-i="${ii}" data-f="a" aria-label="Grocery aisle">${AISLE_OPTS.map(a=>`<option ${a===it.a?"selected":""}>${a}</option>`).join("")}</select>
                  <label class="chk sm"><input type="checkbox" data-g="${gi}" data-i="${ii}" data-f="staple" ${it.staple?"checked":""}> staple</label>
                  <button class="x" data-act="deli" data-g="${gi}" data-i="${ii}" aria-label="Remove ${esc(it.i)}">×</button>
                </div>`).join("")}</div>
              <button class="mini" data-act="addi" data-g="${gi}">+ Add ingredient</button>
            </div>`).join("")}
          <button class="mini" data-act="addg">+ Add ingredient group</button>
          <p class="est">Leave quantity empty for "to taste". "Staple" items start unticked when adding to the grocery list.</p>
        </section>
        <section><h3>Steps</h3>
          ${d.steps.map((s,si)=>`
            <div class="estep">
              <span class="snum">${si+1}</span>
              <div class="sfields">
                <input class="fin" data-s="${si}" data-f="st" value="${esc(s[0])}" placeholder="Short title" aria-label="Step ${si+1} title">
                <textarea class="fin" data-s="${si}" data-f="sx" rows="3" aria-label="Step ${si+1} instructions">${esc(s[1])}</textarea>
              </div>
              <div class="sbtns">
                <button class="mini" data-act="up" data-s="${si}" ${si===0?"disabled":""} aria-label="Move step up">↑</button>
                <button class="mini" data-act="down" data-s="${si}" ${si===d.steps.length-1?"disabled":""} aria-label="Move step down">↓</button>
                <button class="x" data-act="dels" data-s="${si}" aria-label="Remove step ${si+1}">×</button>
              </div>
            </div>`).join("")}
          <button class="mini" data-act="adds">+ Add step</button>
        </section>
        <section><h3>Notes</h3>
          <textarea id="e-notes" class="fin" rows="3">${esc(d.notes||"")}</textarea>
        </section>
        <section class="danger-zone"><h3>More</h3>
          <div class="addrow">
            ${ORIGINAL[r.id] && r.edited ? `<button class="btn ghost" id="e-revert">Undo all my edits to this recipe</button>`:""}
            <button class="btn ghost danger" id="e-hide">Remove recipe from the shelf</button>
            <button class="btn ghost" id="e-lock">Lock editing on this device</button>
          </div>
        </section>
      </div>
      <div class="savebar" id="savebar">
        <div class="sb-in">
          <span id="sbmsg">${dirty?"You have unsaved changes.":"No changes yet."}</span>
          <div class="addrow"><button class="btn ghost" id="e-cancel">Cancel</button><button class="btn" id="e-save" ${dirty?"":"disabled"}>Save…</button></div>
        </div>
      </div>`;
    wire();
  }
  function collect(){
    const v = id => $("#"+id).value;
    d.title = v("e-title").trim() || d.title;
    d.servings = Math.max(1, Math.round(+v("e-serv")||d.servings));
    d.unit = v("e-unit").trim() || d.unit;
    d.time = Math.max(0, Math.round(+v("e-time")||0));
    d.macros = {cal:+v("e-cal")||0, protein:+v("e-pro")||0, carbs:+v("e-carb")||0, fat:+v("e-fat")||0};
    if($("#e-stated").checked) d.stated = ["cal","protein","carbs","fat"];
    else if(["cal","protein","carbs","fat"].every(k=>d.stated.includes(k))) d.stated = (ORIGINAL[r.id]||r).stated.length===4 ? [] : (ORIGINAL[r.id]||r).stated.slice();
    d.tags = v("e-tags").split(",").map(t=>t.trim()).filter(Boolean);
    document.querySelectorAll("[data-f]").forEach(el=>{
      const g = el.dataset.g, i = el.dataset.i, s = el.dataset.s, f = el.dataset.f;
      if(f==="gname") d.groups[g].name = el.value;
      else if(i!==undefined){
        const it = d.groups[g].items[i];
        if(f==="q"){ const t = el.value.trim().replace(",", "."); const fr = t.match(/^(\d+)?\s*(\d+)\/(\d+)$/); it.q = t==="" ? null : fr ? (+(fr[1]||0) + fr[2]/fr[3]) : (isNaN(+t) ? it.q : +t); }
        else if(f==="staple") it.staple = el.checked || undefined;
        else if(f==="note") it.note = el.value.trim() || undefined;
        else it[f] = el.value;
        if(f==="i"||f==="q"||f==="u") delete it.est;
      }
      else if(s!==undefined){ if(f==="st") d.steps[s][0] = el.value; else d.steps[s][1] = el.value; }
    });
    d.notes = v("e-notes");
  }
  function changed(){ dirty = true; window.__editDirty = true; const b=$("#e-save"); if(b) b.disabled=false; const m=$("#sbmsg"); if(m) m.textContent="You have unsaved changes."; }
  function wire(){
    document.querySelectorAll(".eform input, .eform textarea, .eform select").forEach(el=>el.addEventListener("input", changed));
    document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
      collect(); const g=+b.dataset.g, i=+b.dataset.i, s=+b.dataset.s;
      switch(b.dataset.act){
        case "addi": d.groups[g].items.push({q:null,u:"",i:"",a:"Pantry"}); break;
        case "deli": d.groups[g].items.splice(i,1); break;
        case "addg": d.groups.push({name:"New group", items:[{q:null,u:"",i:"",a:"Pantry"}]}); break;
        case "delg": d.groups.splice(g,1); break;
        case "adds": d.steps.push(["",""]); break;
        case "dels": d.steps.splice(s,1); break;
        case "up": [d.steps[s-1],d.steps[s]]=[d.steps[s],d.steps[s-1]]; break;
        case "down": [d.steps[s+1],d.steps[s]]=[d.steps[s],d.steps[s+1]]; break;
      }
      dirty = true; window.__editDirty = true; const y=scrollY; render(); scrollTo(0,y);
    });
    $("#e-cancel").onclick = ()=>{
      if(!dirty) return void (location.hash = "r-"+r.id);
      confirmBar("Discard your unsaved changes?", "Discard", ()=>{ dirty = false; window.__editDirty = false; location.hash = "r-"+r.id; });
    };
    $("#e-save").onclick = ()=>{
      collect();
      d.groups.forEach(g=>g.items = g.items.filter(it=>it.i.trim()));
      d.steps = d.steps.filter(s=>(s[0]+s[1]).trim());
      confirmBar(`Save changes to "${d.title}"? They'll be live on the site within a couple of minutes.`, "Yes, save", async ()=>{
        await persist(()=>saveEdit(r.id, stripRecipe(d)), "Saved");
      });
    };
    $("#e-hide").onclick = ()=> confirmBar(`Remove "${r.title}" from your shelf? You can ask Claude to bring it back later.`, "Remove recipe", async ()=>{
      await persist(()=>saveEdit(r.id, r, {hidden:true}), "Recipe removed", "#");
    }, true);
    const rv = $("#e-revert"); if(rv) rv.onclick = ()=> confirmBar("Undo all your edits and go back to the version from the video?", "Undo my edits", async ()=>{
      await persist(()=>saveEdit(r.id, r, {revert:true}), "Edits undone");
    }, true);
    $("#e-lock").onclick = ()=>{ ghKey.set(""); toast("Editing locked on this device"); location.hash = "r-"+r.id; };
  }
  async function persist(fn, okMsg, goTo){
    $("#savebar .sb-in").innerHTML = `<span id="sbmsg">Saving…</span>`; const m = $("#sbmsg");
    try{
      const data = await fn();
      dirty = false; window.__editDirty = false;
      await reloadRecipes(data);
      toast(okMsg); const target = goTo || ("#r-"+r.id); if(location.hash===target || (target==="#" && !location.hash)) route(); else location.hash = target;
    }catch(e){ const y=scrollY; render(); scrollTo(0,y); $("#sbmsg").innerHTML = `<span class="errmsg">Not saved. ${esc(e.message)}</span>`; }
  }
  function confirmBar(text, yes, onYes, danger){
    const sb = $("#savebar .sb-in");
    sb.innerHTML = `<span><b>${esc(text)}</b></span><div class="addrow"><button class="btn ghost" id="cb-no">Go back</button><button class="btn ${danger?"dangerfill":""}" id="cb-yes">${esc(yes)}</button></div>`;
    $("#cb-no").onclick = ()=>{ const y=scrollY; render(); scrollTo(0,y); };
    $("#cb-yes").onclick = ()=>{ $("#cb-yes").disabled = true; onYes(); };
    $("#cb-yes").focus();
  }
  window.__editDirty = false;
  render();
}
function stripRecipe(d){
  const {id, src, edited, ...rest} = d;
  rest.tags = rest.tags.filter(t=>t!=="Low carb");
  return rest;
}
async function reloadRecipes(edits){
  const data = await fetch("recipes.json",{cache:"no-cache"}).then(r=>r.json());
  RECIPES = data.recipes; ORIGINAL = Object.fromEntries(data.recipes.map(r=>[r.id, JSON.parse(JSON.stringify(r))]));
  RECIPES.forEach(normalizeTags);
  applyEdits(edits);
  $("#tally").textContent = RECIPES.length + " recipes · " + data.sources.length + " videos";
}
async function loadEdits(){
  let remote = null;
  try{ const r = await fetch(EDITS_PATH, {cache:"no-cache"}); if(r.ok) remote = await r.json(); }catch(e){}
  // A just-saved edit can take a minute or two to reach the live site; prefer the newer local copy meanwhile.
  try{
    const c = JSON.parse(localStorage.getItem("rs-edits-cache")||"null");
    if(c && Date.now()-c.at < 3*60*1000) remote = c.data;
  }catch(e){}
  return remote;
}

/* ---------- router ---------- */
function route(){
  const h = location.hash.slice(1);
  ["shelf","grocery","add"].forEach(n=>$("#nav-"+n).removeAttribute("aria-current"));
  if(h.startsWith("edit-")){ const r = RECIPES.find(x=>x.id===h.slice(5)); if(r){ $("#nav-shelf").setAttribute("aria-current","page"); window.scrollTo(0,0); return editView(r); } }
  if(h.startsWith("r-")){ const r = RECIPES.find(x=>x.id===h.slice(2)); if(r){ $("#nav-shelf").setAttribute("aria-current","page"); return detail(r); } }
  if(h==="grocery"){ $("#nav-grocery").setAttribute("aria-current","page"); return grocery(); }
  if(h==="add"){ $("#nav-add").setAttribute("aria-current","page"); return add(); }
  $("#nav-shelf").setAttribute("aria-current","page"); shelf();
}
function boot(data, edits){
  SRC = Object.fromEntries(data.sources.map(s=>[s.key, s]));
  RECIPES = data.recipes;
  ORIGINAL = Object.fromEntries(RECIPES.map(r=>[r.id, JSON.parse(JSON.stringify(r))]));
  RECIPES.forEach(normalizeTags);
  applyEdits(edits);
  $("#tally").textContent = RECIPES.length + " recipes · " + data.sources.length + " videos";
  gcount();
  route();
}
let lastHash = location.hash;
window.addEventListener("hashchange", ()=>{
  if(window.__editDirty && !location.hash.startsWith("#edit-")){
    if(!confirm("You have unsaved changes to this recipe. Leave without saving?")){ history.replaceState(null,"",lastHash); return; }
    window.__editDirty = false;
  }
  lastHash = location.hash;
  if(RECIPES.length) route();
});
window.addEventListener("beforeunload", e=>{ if(window.__editDirty){ e.preventDefault(); e.returnValue = ""; } });
$("#app").innerHTML = `<div class="empty">Loading recipes…</div>`;
Promise.all([fetch("recipes.json", {cache:"no-cache"}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }), loadEdits()]).then(([d,e])=>boot(d,e))
  .catch(()=>{ $("#app").innerHTML = `<div class="empty">Couldn't load the recipes. Check your connection and refresh the page.</div>`; });
</script>

</body>
</html>
